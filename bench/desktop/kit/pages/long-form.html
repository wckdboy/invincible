<!doctype html><meta charset=utf-8><title>Long sign up</title>
<style>body{font:16px sans-serif;margin:32px} label{display:block;margin:56px 0 4px} input,select,textarea{font:16px sans-serif;width:360px;padding:6px} button{margin:56px 0 480px;font:16px sans-serif;padding:8px 20px}</style>
<h1>Long sign up</h1>
<form method=post action="/submit">
<label for=name>Full name</label><input id=name name=name autocomplete=off>
<label for=email>Email</label><input id=email name=email type=email autocomplete=off>
<label for=phone>Phone</label><input id=phone name=phone type=tel autocomplete=off>
<label for=company>Company</label><input id=company name=company autocomplete=off>
<label for=plan>Plan</label><select id=plan name=plan><option>Free</option><option>Team</option><option>Enterprise</option></select>
<label for=city>City</label><input id=city name=city autocomplete=off>
<label for=country>Country</label><select id=country name=country><option>Denmark</option><option>Norway</option><option>Sweden</option></select>
<label><input id=terms name=terms type=checkbox style="width:auto"> I accept the terms</label>
<label for=note>Note</label><textarea id=note name=note rows=3></textarea>
<button id=send type=submit>Send</button>
</form>
