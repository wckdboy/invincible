      dialog.sheet.wide { width: min(760px, calc(100vw - 32px)); }
      dialog.sheet.small { width: min(440px, calc(100vw - 32px)); }
      dialog.sheet::backdrop { background: var(--overlay); opacity: 0; transition: opacity var(--d-2) var(--ease-exit); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
      dialog.sheet.shown::backdrop { opacity: 1; transition: opacity var(--d-3) var(--ease-out); }
      dialog.sheet[data-tone="danger"] { border-color: color-mix(in oklab, var(--danger) 34%, var(--border)); background: radial-gradient(320px 120px at 36px 0, var(--danger-soft), transparent), var(--surface); }
      /* A confirmation's answers are pills, as an alert's actions are everywhere (a toast's, a Needs-you card's). */
      dialog.sheet[role="alertdialog"] .form-actions .btn { border-radius: var(--r-full); padding-inline: var(--sp-4); }
      .sheet-mark { flex: none; display: grid; place-items: center; width: 32px; height: 32px; margin-top: -3px; border-radius: 50%; color: var(--danger); background: var(--danger-soft); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--danger) 26%, transparent); }
      .sheet-handle { display: none; }
      .sheet-head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-5) var(--sp-5) var(--sp-3); }
      .sheet-head h2 { font-size: var(--fs-18); font-weight: 650; letter-spacing: -0.015em; }
      .sheet-head .sub { color: var(--text-2); font-size: var(--fs-13); margin-top: 2px; }
      .sheet-body { padding: var(--sp-2) var(--sp-5) var(--sp-5); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: var(--form-gap); }
      .sheet-foot { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--border); background: var(--bg-sunken); flex-wrap: wrap; }
      @media (max-width: 639px) {
        /* A tray: inset from the screen's edges, every corner round, floating over the page. */
        dialog.sheet, dialog.sheet.wide, dialog.sheet.small {
          width: calc(100vw - 16px); max-width: calc(100vw - 16px); max-height: calc(100dvh - var(--safe-top) - 32px); margin: auto auto calc(8px + var(--safe-bottom)); border-radius: 32px;
          transform: translateY(calc(100% + 16px)); opacity: 1; transition: transform var(--d-sheet) var(--ease-drawer), overlay var(--d-sheet) allow-discrete, display var(--d-sheet) allow-discrete;
        }
        dialog.sheet[open].shown { transform: translateY(var(--drag, 0px)); transition: transform var(--d-sheet) var(--ease-drawer), overlay var(--d-sheet) allow-discrete, display var(--d-sheet) allow-discrete; }
        dialog.sheet.dragging, dialog.sheet[open].shown.dragging { transition: none; }
        .sheet-handle { display: block; flex: none; height: 22px; touch-action: none; cursor: grab; position: relative; }
        .sheet-handle::after { content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 5px; margin-left: -18px; border-radius: 99px; background: var(--border-strong); }
        .sheet-head { padding-top: var(--sp-1); }
        .sheet-foot { border-top: 0; background: none; padding: var(--sp-1) var(--sp-4) var(--sp-4); }
        /* A sheet's buttons, in its foot or at the end of its form, thumb-sized and as wide as the sheet. */
        :is(.sheet-foot, dialog.sheet .form-actions) .btn { flex: 1; min-height: 48px; border-radius: var(--r-full); }
      }

      /* ---------- command palette ---------- */
      dialog.palette {
        margin: 12vh auto auto; padding: 0; width: min(620px, calc(100vw - 24px)); max-height: min(70vh, 560px, var(--room, 70vh));
        border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
        overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: scale(0.98);
        transition: opacity var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), overlay var(--d-1) allow-discrete, display var(--d-1) allow-discrete;
      }
      dialog.palette:not([open]) { display: none; }
      dialog.palette.shown { opacity: 1; transform: none; }
      dialog.palette::backdrop { background: var(--overlay); opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
      dialog.palette.shown::backdrop { opacity: 1; }
      /* Grown out of a button, it shapes itself (palette.ts). */
      dialog.palette[data-grow] { opacity: 1; transform: none; transition: none; }
      /* On a phone it is the top bar's search: its field lies on the bar's line, edge to edge with the bar's padding, over
         the search button at the bar's end (which grows into it). */
      @media (max-width: 639px) {
        dialog.palette { --field-h: 44px; margin-top: calc(var(--safe-top) + (var(--topbar-h) - var(--field-h)) / 2); width: calc(100vw - 2 * var(--sp-4)); max-width: none; max-height: min(70dvh, var(--room, 70dvh)); }
        dialog.palette .palette-input { height: var(--field-h); }
      }
      .palette-input { display: flex; flex: none; align-items: center; gap: 10px; padding: 0 var(--sp-4); height: 54px; border-bottom: 1px solid var(--border); }
      .palette-input input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: var(--fs-16); }
      /* The field is focused whenever the palette is open: an ink rule under it says so. */
      .palette-input:focus-within { box-shadow: inset 0 -2px 0 var(--focus); }
      .palette-input svg { color: var(--text-3); }
      .palette-input:focus-within svg { color: var(--text); }
      .palette-cancel {
        display: none; align-items: center; align-self: stretch; margin-right: calc(-1 * var(--sp-2)); padding: 0 var(--sp-2);
        border: 0; background: none; color: var(--text-2); font-size: var(--fs-15); font-weight: 500; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      }
      .palette-cancel:active { color: var(--text); }
      .palette-list { overflow-y: auto; padding: var(--sp-2); overscroll-behavior: contain; }
      .palette-group { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-2) var(--sp-2) var(--sp-1); }
      .palette-item { display: flex; align-items: center; gap: var(--sp-3); height: 40px; padding: 0 var(--sp-2) 0 10px; border-radius: var(--r-md); cursor: pointer; color: var(--text-2); }
      .palette-item svg { color: var(--text-3); }
      .palette-item .pl-label { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .palette-item .pl-label mark { background: none; color: var(--accent); font-weight: 650; }
      .palette-item .pl-hint { font-size: var(--fs-12); color: var(--text-3); }
      .palette-item[aria-selected="true"] { background: var(--surface-3); }
      .palette-item[aria-selected="true"] svg { color: var(--accent); }
      .palette-foot { display: flex; gap: var(--sp-4); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); color: var(--text-3); font-size: var(--fs-12); background: var(--bg-sunken); }
      .palette-foot span { display: inline-flex; align-items: center; gap: 4px; }
      @media (pointer: coarse) { .palette-foot, .palette-input kbd { display: none; } .palette-cancel { display: inline-flex; } .palette-item { height: 46px; } }

      /* ---------- smart selector: one control that says what's chosen, the choices in a popover (a sheet on phones) ---------- */
      .selector-trigger {
        display: inline-flex; align-items: center; gap: 6px; height: var(--control-h-sm); max-width: 100%; min-width: 0; padding: 0 8px 0 10px;
        border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); color: var(--text);
        font-size: var(--fs-13); font-weight: 550; white-space: nowrap; box-shadow: var(--shadow-1); user-select: none;
        transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out);
      }
      .selector-trigger:hover { background: var(--surface-2); }
      .selector-trigger:active { transform: scale(0.97); }
      .selector-trigger[aria-expanded="true"] { border-color: var(--focus); }
      /* Something other than the default is chosen (a filter is on): the owner's ink. */
      .selector-trigger[data-active="true"] { border-color: var(--accent-border); background: var(--accent-soft); }
      .selector-trigger.ghost { border-color: transparent; background: transparent; box-shadow: none; }
      .selector-trigger.ghost:hover { background: var(--surface-3); }
      .selector-trigger .sel-lead { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
      .selector-trigger .sel-current { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .selector-trigger .sel-chev { color: var(--text-3); margin-left: -1px; }
      dialog.selector-pop {
        position: fixed; inset: auto; margin: 0; padding: 0; width: 320px; max-height: 440px;
        border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
        overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: translateY(-4px) scale(0.98); transform-origin: top left;
        transition: opacity var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), overlay var(--d-1) allow-discrete, display var(--d-1) allow-discrete;
      }
      dialog.selector-pop.above { transform: translateY(4px) scale(0.98); transform-origin: bottom left; }
      dialog.selector-pop:not([open]) { display: none; }
      dialog.selector-pop.shown { opacity: 1; transform: none; }
      dialog.selector-pop::backdrop { background: transparent; }
      .sel-search { flex: none; display: flex; align-items: center; gap: var(--sp-2); height: 42px; padding: 0 var(--sp-3); border-bottom: 1px solid var(--border); color: var(--text-3); }
      .sel-search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; font-size: var(--fs-input); }
      .sel-search input::placeholder { color: var(--text-3); }
      .sel-search:focus-within { box-shadow: inset 0 -2px 0 var(--focus); color: var(--text); }
      .sel-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-1); outline: none; }
      /* Keyboard focus sits on the list; the option it would choose carries the ring. */
      .sel-list:focus-visible { outline: none; }
      .sel-list:focus-visible .sel-option[data-active="true"] { box-shadow: inset 0 0 0 2px var(--focus); }
      .sel-group + .sel-group { margin-top: var(--sp-1); padding-top: var(--sp-1); border-top: 1px solid var(--border); }
      .sel-group-label { font-size: var(--fs-11); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: var(--sp-2) var(--sp-2) var(--sp-1); }
      .sel-option { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 5px var(--sp-2); border-radius: var(--r-md); cursor: pointer; color: var(--text-2); }
      .sel-option[data-active="true"] { background: var(--surface-3); }
      .sel-option > svg.icon { color: var(--text-3); }
      .sel-option[aria-selected="true"] > svg.icon, .sel-option[data-active="true"] > svg.icon { color: var(--accent); }
      .sel-option[aria-disabled="true"] { cursor: not-allowed; }
      .sel-option[aria-disabled="true"] .sel-label { color: var(--text-3); }
      .sel-option .sel-mark { flex: none; width: 15px; display: grid; place-items: center; color: var(--accent); }
      .sel-option .sel-box { flex: none; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; border: 1.5px solid var(--border-strong); background: var(--surface); }
      .sel-option[aria-selected="true"] .sel-box { background: var(--accent-fill); border-color: transparent; color: var(--on-accent); }
      .sel-option .sel-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
      .sel-option .sel-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-option[aria-selected="true"] .sel-label { font-weight: 550; }
      .sel-option .sel-label mark { background: none; color: var(--accent); font-weight: 650; }
      .sel-option .sel-meta { font-size: var(--fs-12); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-empty { padding: var(--sp-5) var(--sp-3); text-align: center; color: var(--text-3); font-size: var(--fs-13); }
      .sel-foot { flex: none; padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--border); background: var(--bg-sunken); font-size: var(--fs-12); color: var(--text-3); }
      /* On phones the same choices sit in a bottom sheet: the sheet scrolls, its rows are thumb-sized. */
      dialog.selector-sheet .sheet-body { gap: var(--sp-2); padding-left: var(--sp-3); padding-right: var(--sp-3); }
      dialog.selector-sheet .sel-search { height: var(--control-h); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); margin: 0 var(--sp-2); }
      dialog.selector-sheet .sel-search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      dialog.selector-sheet .sel-list { overflow: visible; padding: 0; }
      dialog.selector-sheet .sel-foot { margin: 0 var(--sp-2); border: 0; background: none; padding: var(--sp-1) 0 0; }
      @media (pointer: coarse) { .sel-option { min-height: 48px; } }

      /* ---------- toasts (stacked, newest in front) ---------- */
      /* A precise surface with a hairline edge: its tone is in that edge and in a faint light behind its mark, never a
         coloured slab (ui/toast.ts). It comes into focus as it rises and leaves with a short fade and drop. On a phone
         the stack rises above what a page keeps docked at its foot (--dock-h: a composer's height, where there is one). */
      .toaster { position: fixed; z-index: 1000; right: calc(var(--sp-4) + var(--safe-right)); bottom: max(calc(var(--sp-4) + var(--safe-bottom)), calc(var(--dock-h, 0px) + var(--sp-2))); width: min(380px, calc(100vw - 32px)); pointer-events: none; }
      @media (max-width: 959px) { .toaster { left: 50%; right: auto; transform: translateX(-50%); bottom: max(calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-3)), calc(var(--dock-h, 0px) + var(--sp-2))); } }
      .toast {
        --i: 0; position: absolute; right: 0; bottom: 0; width: 100%; pointer-events: auto; overflow: hidden;
        display: flex; align-items: flex-start; gap: 10px; padding: 14px 10px 14px var(--sp-4);
        color: var(--text); font-size: var(--fs-13); border-radius: var(--r-xl);
        background: radial-gradient(112px 56px at 24px 22px, var(--tone-soft, transparent), transparent), var(--alert-glass);
        -webkit-backdrop-filter: var(--alert-blur, none); backdrop-filter: var(--alert-blur, none);
        border: 1px solid color-mix(in oklab, var(--tone, var(--text-3)) 22%, var(--alert-line));
        box-shadow: inset 0 1px 0 var(--alert-lit), var(--shadow-2);
        transform-origin: bottom center;
        transform: translateY(calc(var(--i) * -10px)) scale(calc(1 - var(--i) * 0.05), calc((1 - var(--i) * 0.05) * var(--fit, 1))); opacity: calc(1 - var(--i) * 0.2);
        transition: transform var(--d-spring) var(--ease-spring), opacity var(--d-enter) var(--ease-out), filter var(--d-enter) var(--ease-out);
      }
      @media (max-width: 639px) { .toast { font-size: var(--fs-15); } }
      /* Coming in: a few pixels below, out of a slight blur, a whisper smaller. */
      .toast.entering { opacity: 0; transform: translateY(14px) scale(0.97); filter: blur(6px); }
      /* Going: a short fade and drop, quicker than it came. */
      .toast.leaving { opacity: 0; transform: translateY(calc(var(--i) * -10px + 10px)) scale(calc(1 - var(--i) * 0.05), calc((1 - var(--i) * 0.05) * var(--fit, 1))); transition: transform var(--d-2) var(--ease-exit), opacity var(--d-1) var(--ease-exit); }
      .toast[data-hidden="true"] { opacity: 0; pointer-events: none; }
      /* Fanned out under the pointer, or where a finger's focus is: each whole, above the newer ones. */
      .toaster:is(:hover, :focus-within) .toast { transform: translateY(calc(var(--offset, 0px) * -1)); opacity: 1; transition-duration: var(--d-3); }
      .toaster:is(:hover, :focus-within) .toast.entering { transform: translateY(calc(var(--offset, 0px) * -1 + 14px)) scale(0.97); opacity: 0; }
      .toaster:is(:hover, :focus-within) .toast.leaving { transform: translateY(calc(var(--offset, 0px) * -1 + 10px)); opacity: 0; transition-duration: var(--d-2), var(--d-1); }
      /* Tucked: those behind the front one are drawn as tall as it (--fit, a scale: a new height would move them on the
         page) with their words out of sight, so only their edges show. */
      .toast > * { transition: opacity var(--d-2) var(--ease-out); }
      .toaster:not(:hover):not(:focus-within) .toast:not([data-front]) > * { opacity: 0; }
      .toast-lead { flex: none; display: grid; place-items: center; width: 20px; height: 20px; color: var(--tone, var(--text-2)); }
      @media (max-width: 639px) { .toast-lead { height: 22px; } }
      /* A knight's face or his orb: who it is about, still, beside their name in the title. */
      .toast-lead.is-face { width: 28px; height: 28px; margin: -4px 0; }
      .toast-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .toast-title { font-weight: 600; letter-spacing: -0.005em; }
      .toast-desc { color: var(--text-2); overflow-wrap: anywhere; }
      .toast .toast-action { flex: none; margin: -4px 0; border-radius: var(--r-full); padding-inline: 12px; }
      .toast .toast-close { flex: none; margin: -4px 0; color: var(--text-3); }
      .toast .toast-close:hover { color: var(--text); }
      /* Each control of an alert takes a finger: 44 px to touch however small it is drawn (an action's reach grows up and
         down only, so it never takes its neighbour's). */
      :is(.toast, .banner-pill, .sheet-head) .btn.sm::after { content: ""; position: absolute; inset: calc((var(--control-h-sm) - 44px) / 2); }
      .toast .toast-action::after { inset: calc((var(--control-h-sm) - 44px) / 2) 0; }

      /* ---------- markdown ---------- */
      .md { line-height: 1.65; overflow-wrap: anywhere; }
      .md > * + * { margin-top: 0.75em; }
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; margin-top: 1.1em; }
      .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; } .md h4, .md h5, .md h6 { font-size: 1em; }
      .md ul, .md ol { padding-left: 1.4em; margin-bottom: 0; }
      .md li + li { margin-top: 0.3em; }
      .md li > * + * { margin-top: 0.4em; }
      .md li::marker { color: var(--text-3); }
      .md blockquote { margin: 0; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--border-strong); color: var(--text-2); }
      .md hr { border: 0; height: 1px; background: var(--border); }
      .md code { font: 0.88em/1.4 var(--font-mono); padding: 0.12em 0.36em; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }
      .md a { overflow-wrap: anywhere; }
      .md .host { color: var(--text-3); font-size: 0.85em; margin-left: 2px; }
      .codeblock { position: relative; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-sunken); overflow: hidden; }
      .codeblock .cb-head { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-3); }
      .codeblock pre { margin: 0; padding: 12px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); tab-size: 2; }
      .codeblock pre code { background: none; border: 0; padding: 0; font: inherit; }
      /* Code's parts (lib/highlight.ts): its words in the cross's red, quiet blues for what it holds, comments recede. */
      .codeblock { --code-keyword: light-dark(#b3261e, #ff8a80); --code-string: light-dark(#0a3069, #a5d6ff); --code-number: light-dark(#0550ae, #79c0ff); --code-comment: light-dark(#6e7781, #8b949e); }
      .tok-keyword { color: var(--code-keyword); }
      .tok-string { color: var(--code-string); }
      .tok-number { color: var(--code-number); }
      .tok-comment { color: var(--code-comment); font-style: italic; }
      .tok-added { color: light-dark(#116329, #7ee2a8); background: light-dark(#dafbe1, rgb(46 160 67 / 0.18)); }
      .tok-removed { color: light-dark(#82071e, #ffa198); background: light-dark(#ffebe9, rgb(248 81 73 / 0.16)); }
      .tok-meta { color: var(--text-3); font-weight: 600; }
      .tok-added-text { color: light-dark(#116329, #7ee2a8); }
      .tok-removed-text { color: light-dark(#82071e, #ffa198); }
      /* A knight's workspace, read (views/workspace.ts): its folders, files and changed files as rows to open. */
      button.workspace-entry { width: 100%; text-align: left; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; gap: 10px; }
      button.workspace-entry:hover:not(:disabled) { background: var(--surface-2); }
      button.workspace-entry:disabled { cursor: default; opacity: 0.6; }
      .workspace-status { width: 14px; text-align: center; font-weight: 700; }
      .md .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
      .md table { border-collapse: collapse; width: 100%; font-size: 0.93em; }
      .md th, .md td { padding: 7px 10px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
      .md thead th { border-top: 0; background: var(--surface-2); font-weight: 600; }
      .md mark, mark.hl { background: color-mix(in srgb, var(--warn) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

      /* ---------- what an answer shows beyond words (ui/blocks.ts): a chart, figures, choices, steps, a page ---------- */
      /* The chart colours, in a fixed order, checked for colour-blind separation and contrast on each theme's surface. */
      :root { --viz-1: light-dark(#2a78d6, #3987e5); --viz-2: light-dark(#eb6834, #d95926); --viz-3: light-dark(#1baf7a, #199e70); --viz-4: light-dark(#eda100, #c98500); --viz-5: light-dark(#e87ba4, #d55181); --viz-6: #008300; }
      .viz, .viz-stats, .viz-steps, .viz-page, .viz-picture, .viz-pending, .viz-refused, .viz-choices { margin: var(--sp-3) 0; }
      .viz { position: relative; padding: 12px 12px 4px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); outline: none; }
      .viz:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
      .viz-head { display: flex; align-items: baseline; gap: var(--sp-2); margin-bottom: 6px; }
      .viz-title { font-weight: 600; font-size: var(--fs-14); }
      .viz-unit { font-size: var(--fs-12); color: var(--text-3); }
      .viz-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 4px; font-size: var(--fs-12); color: var(--text-2); }
      .viz-key { display: inline-flex; align-items: center; gap: 6px; }
      .viz-swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--key); }
      .viz-stroke { width: 12px; height: 2px; border-radius: 1px; background: var(--key); }
      .viz-stroke.blank { background: none; }
      .viz-plot { position: relative; }
      .viz-svg { display: block; width: 100%; height: auto; overflow: visible; }
      .viz-grid line { stroke: var(--border); stroke-width: 1; shape-rendering: crispEdges; }
      .viz-grid line.viz-zero { stroke: var(--border-strong); }
      .viz-tick { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
      .viz-value { font-size: 11px; fill: var(--text-2); font-weight: 600; }
      .viz-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .viz-wash { opacity: 0.1; stroke: none; }
      .viz-dot { stroke: var(--surface); stroke-width: 2; }
      .viz-band { fill: var(--surface-3); rx: 4px; }
      .viz-cross { stroke: var(--text-3); stroke-width: 1; shape-rendering: crispEdges; }
      .viz-hit { fill: transparent; cursor: crosshair; touch-action: pan-y; }
      .viz-tip {
        position: absolute; top: 4px; left: 0; z-index: 2; padding: 8px 10px; pointer-events: none; white-space: nowrap;
        border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-2); font-size: var(--fs-12); color: var(--text-2);
      }
      .viz-tip-row > span:last-child:not(.viz-stroke) { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
      .viz-tip-label { margin-bottom: 4px; color: var(--text-3); }
      .viz-tip-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
      .viz-tip-row strong { color: var(--text); font-variant-numeric: tabular-nums; }
      .viz-data { margin: 2px -4px 0; font-size: var(--fs-12); }
      .viz-data summary { cursor: pointer; padding: 6px 4px; color: var(--text-3); width: max-content; }
      .viz-data table { margin-bottom: 8px; font-variant-numeric: tabular-nums; }
      .viz-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--sp-2); }
      .viz-stat { padding: 12px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); min-width: 0; }
      .viz-stat-label { font-size: var(--fs-12); color: var(--text-2); }
      .viz-stat-value { margin-top: 2px; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
      .viz-stat-unit { margin-left: 4px; font-size: var(--fs-13); font-weight: 500; color: var(--text-3); letter-spacing: 0; }
      .viz-delta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin-top: 4px; font-size: var(--fs-12); font-weight: 600; color: var(--text-2); }
      .viz-delta.good { color: var(--ok); }
      .viz-delta.bad { color: var(--danger); }
      .viz-note { font-size: var(--fs-12); font-weight: 400; color: var(--text-3); }
      .viz-choices { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
      .viz-choice {
        min-height: 36px; padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: var(--r-full); background: var(--surface); color: var(--text);
        font-size: var(--fs-14); font-weight: 550; text-align: left; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        transition: background-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out);
      }
      button.viz-choice:hover { background: var(--surface-2); }
      button.viz-choice:active:not(:disabled) { transform: scale(0.97); }
      button.viz-choice:disabled { opacity: 0.5; }
      button.viz-choice[aria-pressed="true"] { opacity: 1; border-color: var(--text); }
      .viz-choice.static { color: var(--text-2); border-style: dashed; }
      @media (pointer: coarse) { .viz-choice { min-height: 44px; } }
      .viz-steps { list-style: none; padding: 0; display: grid; gap: 6px; }
      .viz-steps li { display: flex; align-items: flex-start; gap: 10px; }
      .viz-steps li > svg, .viz-todo { flex: none; margin-top: 3px; }
      .viz-todo { width: 16px; height: 16px; border: 1.5px solid var(--text-3); border-radius: 50%; }
      .viz-steps li[data-state="done"] { color: var(--text-2); }
      .viz-steps li[data-state="done"] > svg { color: var(--ok); }
      .viz-steps li[data-state="doing"] { font-weight: 600; }
      .viz-steps li[data-state="failed"] > svg { color: var(--danger); }
      .viz-steps li[data-state="skipped"] { color: var(--text-3); text-decoration: line-through; }
      .viz-page { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
      .viz-page-head { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--border); }
      .viz-page-head > strong { font-size: var(--fs-14); }
      .viz-frame { display: block; width: 100%; height: 320px; border: 0; background: #fff; }
      .viz-frame.tall { height: min(78dvh, 900px); border-radius: var(--r-md); }
      .viz-page .codeblock { border: 0; border-radius: 0; }
      .viz-page-note { margin: 0; padding: 8px 12px; border-top: 1px solid var(--border); font-size: var(--fs-12); color: var(--text-3); }
      .viz-picture { display: grid; gap: 4px; justify-items: start; }
      .viz-picture img { max-width: 100%; max-height: 420px; border: 1px solid var(--border); border-radius: var(--r-md); background: #fff; }
      .viz-pending { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed var(--border-strong); border-radius: var(--r-lg); color: var(--text-3); font-size: var(--fs-13); }

      /* ---------- A task's thread (views/task.ts): its crumb, its brief, its work folded, its proof, its details ---------- */
      .shell[data-route="task"] main.view { padding: 0; }
      .thread-page { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 320px; }
      .thread-head {
        flex: none; flex-wrap: nowrap; align-items: center; gap: var(--sp-2); margin: 0; min-height: 52px;
        padding: calc(var(--safe-top) + var(--sp-2)) var(--sp-4) var(--sp-2); border-bottom: 1px solid var(--border); background: var(--bg);
      }
      .thread-head-name { width: 180px; height: 18px; }
      .thread-head-line { width: 120px; max-width: 100%; margin-top: 6px; }
      .thread-crumb { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
      .thread-crumb-project { flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 30%; color: var(--text-2); font-size: var(--fs-13); }
      .thread-crumb-sep { flex: none; color: var(--text-3); }
      .thread-head .thread-title { min-width: 0; font-size: var(--fs-14); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
      .thread-sub { display: none; }
      .thread-head-face { flex: none; display: grid; place-items: center; width: 28px; height: 28px; }
      .thread-head-acts { flex: none; display: flex; align-items: center; gap: 2px; }
      .thread-head-acts .btn > svg { color: var(--text-2); }
      .thread-details-toggle[aria-pressed="true"] { --btn-bg: var(--surface-3); color: var(--text); }
      .thread-body { position: relative; display: flex; flex: 1; min-height: 0; }
      .thread-column { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
      .thread-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; outline: none; }
      .thread-items { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 760px; margin: 0 auto; padding: var(--sp-5) var(--sp-5) var(--sp-6); }
      .thread-dispatch { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-2); font-size: var(--fs-13); }
      .thread-dispatch > svg { flex: none; color: var(--text-3); }
      .thread-brief { padding: 10px 14px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); font-size: var(--fs-14); line-height: 1.55; overflow-wrap: anywhere; }
      .thread-facts { font-size: var(--fs-12); }
      .thread-by { margin-top: var(--sp-2); color: var(--text-2); font-size: var(--fs-13); }
      .thread-by > strong { color: var(--text); font-weight: 600; }
      /* The work, folded: "Ada worked for 6m 12s ›", its steps grouped under it. */
      .thread-worked { margin-top: var(--sp-2); }
      .thread-worked > summary { display: flex; align-items: center; gap: 6px; width: fit-content; max-width: 100%; padding: 4px 0; color: var(--text-2); font-size: var(--fs-13); cursor: pointer; list-style: none; }
      .thread-worked > summary::-webkit-details-marker { display: none; }
      .thread-worked > summary:hover { color: var(--text); }
      .thread-worked > summary .chev { flex: none; transition: transform var(--d-1) var(--ease-out); }
      .thread-worked[open] > summary .chev { transform: rotate(90deg); }
      .thread-steps { display: flex; flex-direction: column; gap: 3px; margin: 4px 0 0; padding: 0 0 0 2px; list-style: none; }
      .thread-step { min-width: 0; font-size: var(--fs-13); color: var(--text-2); }
      .thread-step summary { list-style: none; cursor: pointer; }
      .thread-step summary::-webkit-details-marker { display: none; }
      .thread-step summary:hover .step-text { color: var(--text); }
      .step-line { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; min-height: 22px; }
      .step-icon { flex: none; display: grid; place-items: center; width: 16px; height: 16px; color: var(--tone, var(--text-3)); }
      .step-items { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 24px; padding: 6px 10px; border-radius: var(--r-md); background: var(--bg-sunken); list-style: none; }
      .step-item { font-size: var(--fs-12); color: var(--text-2); overflow-wrap: anywhere; }
      .step-item.mono { font-family: var(--font-mono); font-size: 11.5px; }
      .step-exit { color: var(--failed); }
      .thread-ask .need { padding: 12px 14px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px color-mix(in srgb, var(--needs) 34%, var(--border)); }
      .thread-said { display: flex; flex-direction: column; gap: 6px; margin-top: var(--sp-1); }
      .thread-said-by { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--text-2); }
      .thread-said-by > strong { color: var(--text); font-weight: 600; }
      .thread-said > .md { font-size: var(--fs-14); line-height: 1.6; }
      /* What proves it, apart from the knight's words: its own ground and edge in its verdict's colour. */
      .proof { --verdict: var(--ok); display: flex; flex-direction: column; margin-top: var(--sp-1); border-radius: 14px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow-1), inset 0 0 0 1px color-mix(in srgb, var(--verdict) 42%, var(--border)); }
      .proof[data-verdict="failed"] { --verdict: var(--failed); }
      .proof > * + * { border-top: 1px solid color-mix(in srgb, var(--verdict) 16%, var(--border)); }
      .proof-seal { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: color-mix(in srgb, var(--verdict) 9%, var(--surface)); }
      .proof-seal strong { color: var(--verdict); font-weight: 650; }
      .proof-by { color: var(--text-2); font-size: var(--fs-13); }
      .proof-mark { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--verdict); color: var(--surface); }
      .proof-caveat { display: flex; align-items: flex-start; gap: var(--sp-2); padding: 8px 14px; color: var(--warn); font-size: var(--fs-12); line-height: 1.45; }

        .team-head > .worker-avatar { width: 32px; height: 32px; }

        .avatar-editor-stage > .stack { width: 100%; }
      }
      /* ---------- end Team workspace ---------- */

      /* ---------- chat ---------- */
      .chat { display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; min-height: calc(100dvh - var(--tabbar-h) - var(--safe-bottom)); }
      @media (min-width: 960px) { .chat { min-height: 100dvh; } }
      /* The chat's header is Galahad himself, and on this page it takes the top bar's place: his face and what he's
         doing now in a line (a tap shows what he has in hand), then your chats, a new one, and the chat's one menu. */
      .shell[data-route="chat"] main.view { padding-top: 0; }
      .shell[data-route="chat"] .main-col { overflow-x: clip; }
      .chat-head { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: var(--sp-2); min-width: 0; padding: calc(var(--safe-top) + 6px) 0 6px; margin-bottom: var(--sp-3); }
      /* (Its ground runs the page's whole width, as the top bar's does, whatever the column's.) */
      .chat-head::before { content: ""; position: absolute; z-index: -1; inset: 0 -100vw; background: var(--bg); }
      .chat-head > .btn, .chat-head > .selector-trigger { flex: none; }
      .chat-inbox { position: relative; }
      .chat-inbox .count { position: absolute; top: -4px; right: -4px; }
      .chat-who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 2px 8px 2px 2px; margin-left: -2px; border: 0; border-radius: var(--r-md); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .chat-who:hover { background: var(--surface-2); }
      .chat-who-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
      .chat-name { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-weight: 650; letter-spacing: -0.01em; }
      .chat-as { font-weight: 400; font-size: var(--fs-12); letter-spacing: 0; color: var(--text-3); }
      .chat-now { font-size: var(--fs-12); color: var(--tone, var(--text-2)); }
      /* The chat's title, or that it's temporary, or its place while it's opened: one height whichever it is. */
      .chat-sub { display: flex; align-items: center; gap: var(--sp-2); margin-top: calc(-1 * var(--sp-1)); padding-bottom: var(--sp-3); min-width: 0; min-height: calc(var(--fs-body) * 1.5 + 4px + var(--sp-3)); }
      .chat-sub-pending { width: 180px; }
      .chat-sub:empty { display: none; }
      .chat-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font: inherit; font-weight: 600; color: var(--text); background: none; border: 0; cursor: pointer; padding: 2px 6px; margin-left: -6px; border-radius: var(--r-sm); max-width: min(100%, 520px); }
      .selector-trigger.icon-only { width: var(--control-h-sm); padding: 0; justify-content: center; flex: none; }
      .selector-trigger.icon-only .sel-current, .selector-trigger.icon-only .sel-chev { display: none; }
      .selector-trigger.icon-only .sel-lead { color: inherit; }
      .chat-title:hover { background: var(--surface-2); }
      .chat-row { font: inherit; text-align: left; width: 100%; background: none; border: 0; cursor: pointer; color: inherit; }
      .chat-row:hover, .chat-row[aria-current="true"] { background: var(--surface-2); }
      .chat-row-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .recent-chats { display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: min(100%, 520px); margin: var(--sp-6) auto 0; text-align: left; }
      /* While you were away (PLAN #37): under the welcome, as wide as your recent chats; each line led by its state's dot. */
      .away { display: flex; flex-direction: column; gap: var(--sp-2); width: min(100%, 520px); margin: var(--sp-4) auto 0; text-align: left; }
      .away ul { list-style: none; padding-left: 0; }
      .away li { align-items: baseline; }
      .away li .dot { flex: none; }
      .card-link { font: inherit; text-align: left; color: inherit; cursor: pointer; }
      .card-link:hover { border-color: var(--border-strong); }
      .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .thread { flex: 1; display: flex; flex-direction: column; gap: var(--sp-6); padding-bottom: var(--sp-6); }
      .turn { display: flex; gap: var(--sp-3); min-width: 0; }
      .turn.user { justify-content: flex-end; }
      .turn.user .bubble { max-width: min(88%, 620px); background: var(--surface-2); border: 1px solid var(--border); padding: 9px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .turn.assistant .turn-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
      .turn .avatar { margin-top: 1px; }
      .turn-actions { display: flex; gap: 2px; min-height: 28px; }
      @media (hover: hover) {
        .turn .turn-actions { opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
        .turn:hover .turn-actions, .turn:focus-within .turn-actions, .turn.last .turn-actions { opacity: 1; }
      }
      .turn.user .turn-actions { justify-content: flex-end; }
      .turn-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 0; }
      /* What a message of yours carried: pictures to tap open, texts by name. */
      .attached { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: min(88%, 620px); }
      .attached-picture { padding: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface-2); width: 132px; height: 132px; cursor: zoom-in; }
      .attached-picture img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .attached-picture.gone { cursor: default; }
      .attached-file { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); font-size: var(--fs-13); }
      .attached-large { display: block; max-width: 100%; max-height: 72vh; margin: 0 auto; border-radius: 8px; }
      .caret { display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: text-bottom; border-radius: 2px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      :root[data-motion="reduce"] .caret { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .caret { animation: none; } }
      .process { display: flex; flex-direction: column; gap: 0; font-size: var(--fs-12); color: var(--text-2); min-width: 0; }
      .process summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; color: var(--text-3); width: fit-content; max-width: 100%; min-width: 0; border-radius: var(--r-sm); padding: 2px 6px 2px 2px; }
      .process summary > .ellipsis { min-width: 0; }
      .process summary > svg, .process summary > .spinner { flex: none; }
      .process summary::-webkit-details-marker { display: none; }
      @media (pointer: coarse) { .process summary { min-height: 32px; } }
      .process summary:hover { color: var(--text-2); background: var(--surface-2); }
      .process summary svg { transition: transform var(--d-2) var(--ease-out); }
      .process[open] summary .chev { transform: rotate(90deg); }
      /* What a process opens onto, under its line. */
      .process-body { margin-top: var(--sp-2); }
      .steps { list-style: none; margin: 6px 0 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 0; }
      .step { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; position: relative; padding-bottom: 8px; }
      .step:not(:last-child)::before { content: ""; position: absolute; left: 7.5px; top: 17px; bottom: 0; width: 1px; background: var(--border); }
      .step .step-mark { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-3); }
      .step .step-mark svg { width: 14px; height: 14px; }
      .step[data-state="active"] .step-mark { color: var(--accent); }
      .step[data-state="done"] .step-mark { color: var(--ok); }
      .step[data-state="warn"] .step-mark { color: var(--warn); }
      .step[data-state="error"] .step-mark { color: var(--danger); }
      .step .step-text { line-height: 16px; min-width: 0; }
      .step .step-detail { color: var(--text-3); overflow-wrap: anywhere; }
      /* The composer sticks to the bottom; on the chat page main drops its extra bottom space so the
         composer's resting place and its sticky place coincide (nothing hides behind it). */
      .composer-wrap { position: sticky; bottom: calc(var(--tabbar-h) + var(--safe-bottom)); padding: var(--sp-2) 0 var(--sp-3); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
      .shell[data-route="chat"] main.view { padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom)); }
      @media (min-width: 960px) {
        .composer-wrap { bottom: 0; padding-bottom: var(--sp-5); }
        .shell[data-route="chat"] main.view { padding-bottom: 0; }
      }
      /* The on-screen keyboard is up (iOS keeps the page full height under it): the tab bar steps aside
         and the composer sits on the keyboard instead of a tab bar's height above it, and nothing keeps
         clear the home indicator's strip, which the keyboard covers. */
      :root[data-keyboard="open"] { --safe-bottom: 0px; }
      :root[data-keyboard="open"] .composer-wrap { bottom: 0; }
      :root[data-keyboard="open"] main.view, :root[data-keyboard="open"] .shell[data-route="chat"] main.view { padding-bottom: var(--sp-3); }
      /* A phone's top bar keeps the way home, search and "…": the machine is on Home's header, and under "…". */
      @media (max-width: 639px) {
        .topbar .fleet-pill { display: none; }
      }
      .composer { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-2); transition: border-color var(--d-1) var(--ease-out), box-shadow var(--d-1) var(--ease-out); }
      .composer:focus-within { border-color: color-mix(in srgb, var(--focus) 60%, var(--border-strong)); box-shadow: var(--shadow-2), 0 0 0 3px color-mix(in srgb, var(--focus) 14%, transparent); }
      .composer textarea { display: block; width: 100%; border: 0; outline: none; background: none; resize: none; padding: 12px 14px 4px; max-height: 40vh; min-height: 48px; line-height: 1.5; font-size: var(--fs-input); }
      .composer .composer-bar { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 8px 8px 12px; }
      .composer .hint { font-size: var(--fs-12); color: var(--text-3); }
      .composer .send { width: 34px; height: 34px; padding: 0; border-radius: 10px; flex: none; }
      /* Files with your next message, above its words; a box they're dropped on is outlined. */
      .composer.dropping { border-color: var(--focus); box-shadow: var(--shadow-2), 0 0 0 3px color-mix(in srgb, var(--focus) 24%, transparent); }
      .composer-files { display: flex; gap: 6px; padding: 10px 10px 0; overflow-x: auto; scrollbar-width: none; }
      .composer-files[hidden] { display: none; }
      .composer-file { display: flex; align-items: center; gap: 8px; flex: none; max-width: 220px; padding: 4px 2px 4px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
      .composer-file.failed { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
      .composer-file .file-look-wrap { position: relative; flex: none; display: grid; place-items: center; }
      .composer-file .file-look { width: 36px; height: 36px; border-radius: 7px; object-fit: cover; display: grid; place-items: center; color: var(--text-3); }
      .composer-file .file-kind { background: var(--surface); border: 1px solid var(--border); }
      .composer-file.going .file-look { opacity: 0.45; }
      .composer-file .file-look-wrap .spinner { position: absolute; }
      .composer-file .file-words { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
      .composer-file .file-name { font-size: var(--fs-13); }
      .composer-file .file-said { font-size: var(--fs-12); color: var(--text-3); }
      .composer-file.failed .file-said { color: var(--danger); }
      @media (pointer: coarse) { .composer .send { width: 40px; height: 40px; } }
      .composer-wrap .callout { margin-bottom: var(--sp-2); box-shadow: var(--shadow-2); }
      /* "Latest", over the composer, when the thread is scrolled up (views/chat.ts). */
      .jump-anchor { position: relative; }
      .btn.jump { position: absolute; left: 50%; top: -40px; transform: translateX(-50%); box-shadow: var(--shadow-2); }
      .btn.jump:active:not(:disabled) { transform: translateX(-50%) scale(0.97); }
      /* A key he asked for in this chat, sealed right here (views/chat.ts). */
      /* What is under way in a chat (views/underway.ts): his knights' tasks given there, his looks that wait. */
      .underway { display: flex; flex-direction: column; margin-bottom: var(--sp-2); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-2); overflow: hidden; }
      .underway[hidden] { display: none; }
      .underway-row { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 8px 6px 10px; min-height: 44px; }
      .underway-row + .underway-row { border-top: 1px solid var(--border); }
      .underway-main { display: flex; align-items: center; gap: var(--sp-2); flex: 1; min-width: 0; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; }
      button.underway-main { cursor: pointer; border-radius: 8px; }
      button.underway-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .underway-words { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
      .underway-who { font-size: var(--fs-13); font-weight: 600; }
      .underway-what { font-size: var(--fs-12); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .underway-row[data-kind="look"] .underway-what { color: var(--text-2); font-size: var(--fs-13); white-space: normal; }
      /* A look of his come back: his own note in the thread, not a message of yours. */
      .turn.look { justify-content: center; align-items: center; gap: 6px; color: var(--text-3); font-size: var(--fs-13); text-align: center; padding: 2px var(--sp-4); }
      .key-asks { display: flex; flex-direction: column; gap: var(--sp-2); }
      .key-asks:not(:empty) { margin-bottom: var(--sp-2); }
      .key-asks .card { box-shadow: var(--shadow-2); }
      /* While he works: steer or queue (the one Enter does is in ink), and Stop. */
      .composer .composer-bar .btn.sm { flex: none; }
      @media (pointer: coarse) { .composer .composer-bar .btn.sm:not(.icon-only) { height: 40px; padding: 0 14px; font-size: var(--fs-13); } }
      /* What's waiting while he works: steers on their way, the queue (held or not), and what unattended work may do. */
      .chat-queue { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-2); font-size: var(--fs-13); min-width: 0; }
      .chat-queue-head { display: flex; align-items: center; gap: 8px; color: var(--text-2); min-width: 0; }
      .chat-queue-head > svg { flex: none; color: var(--text-3); }
      .chat-queue-head strong { color: var(--text); font-weight: 600; }
      .chat-queue-head.held { flex-wrap: wrap; }
      .chat-queue-head.held > svg { color: var(--warn); }
      .chat-queue-head.held .grow { min-width: min(100%, 220px); }
      .chat-queue-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; max-height: 30vh; overflow: auto; overscroll-behavior: contain; }
      .chat-queue-item { display: flex; align-items: center; gap: 6px; padding: 3px 0 3px 22px; min-width: 0; border-top: 1px solid var(--border); }
      .chat-queue-item.editing { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 0; }
      .chat-queue-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
      .chat-queue-actions { display: flex; align-items: center; gap: 2px; flex: none; }
      .chat-queue-note { color: var(--danger); }
      .chat-queue-steer { display: flex; align-items: flex-start; gap: 8px; color: var(--text-2); min-width: 0; }
      .chat-queue-steer .spinner { width: 12px; height: 12px; margin-top: 3px; }
      .chat-queue-steer > div { min-width: 0; flex: 1; }
      .chat-queue-foot { display: flex; align-items: flex-start; gap: 6px; color: var(--text-3); line-height: 1.45; }
      .chat-queue-foot > svg { flex: none; margin-top: 2px; }
      .chat-queue.compact { font-size: var(--fs-12); padding: 6px var(--sp-2) 6px var(--sp-3); }
      .chat-queue.compact .chat-queue-item { padding-left: 0; }
      .chat-queue.compact .chat-queue-list { max-height: 22vh; }
      @media (max-width: 520px) {
        .chat-queue-item { flex-wrap: wrap; padding-left: 0; }
        .chat-queue-text { flex-basis: 100%; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .chat-queue-actions { margin-left: auto; }
      }
      /* A chat's state in a list: working (with a spinner), needs you, queued, stopped, failed. */
      .chat-state { flex: none; max-width: 48%; overflow: hidden; text-overflow: ellipsis; gap: 5px; }
      .chat-state .spinner { border-width: 1.5px; }
      /* In hand (Overview): the turns the node is running, and each quest's plan, step and gates. */
      .in-hand .section { gap: var(--sp-2); }
      .in-hand-turn .meta { flex-wrap: wrap; row-gap: 2px; }
      .in-hand-doing { display: flex; align-items: center; gap: 6px; color: var(--text-2); min-width: 0; font-family: var(--font-mono); font-size: var(--fs-12); }
      .in-hand-doing > svg { flex: none; color: var(--text-3); }
      .in-hand-summary { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      .in-hand-gate { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .in-hand-gate code { flex: 1; min-width: 0; font-size: var(--fs-12); color: var(--text-2); }
      .in-hand-gate .badge, .in-hand-gate .tiny { flex: none; }
      .in-hand-gate-detail > summary { list-style: none; cursor: pointer; }
      .in-hand-gate-detail > summary::-webkit-details-marker { display: none; }
      .in-hand-gate-detail pre, .in-hand-plan-text { margin: 6px 0 0; padding: 8px 10px; border-radius: var(--r-sm); background: var(--bg-sunken); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
      .in-hand-plan > summary { cursor: pointer; color: var(--text-3); width: fit-content; }
      .in-hand-plan-text { font: inherit; font-size: var(--fs-13); color: var(--text-2); }
      @media (max-width: 520px) { .in-hand-gate { flex-wrap: wrap; } .in-hand-gate code { flex-basis: 100%; order: 3; } }

      /* The doctor's card on the Overview: the verdict, what needs you with what to do, every other line one click away. */
      .doctor { padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--section-gap); }
      .doctor-head { display: flex; align-items: flex-start; gap: var(--sp-3); }
      .doctor-head > .dot, .doctor-row > .dot { margin-top: 6px; }
      .doctor-list, .doctor-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
      .doctor-list { gap: var(--sp-2); }
      .doctor-item { display: flex; flex-direction: column; gap: 6px; padding: var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); }
      .doctor-item-head { display: flex; align-items: flex-start; gap: var(--sp-2); }
      .doctor-item-head .badge { flex: none; margin-top: 1px; }
      .doctor-line { font-size: var(--fs-13); overflow-wrap: anywhere; min-width: 0; }
      .doctor-fix { display: flex; gap: 6px; align-items: flex-start; color: var(--text-2); font-size: var(--fs-13); overflow-wrap: anywhere; }
      .doctor-fix > svg { flex: none; margin-top: 3px; color: var(--text-3); }
      .doctor-all > summary { cursor: pointer; color: var(--text-3); width: fit-content; min-height: 24px; }
      .doctor-group { margin-top: var(--sp-3); display: flex; flex-direction: column; gap: 6px; }
      .doctor-rows { gap: 6px; }
      .doctor-row { display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--fs-13); color: var(--text-2); }
      .doctor-row[data-state="skipped"] { color: var(--text-3); }
      .doctor-row-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
      .doctor-foot { display: flex; align-items: flex-end; gap: var(--sp-3); flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: var(--sp-3); }
      .doctor-foot p { margin: 0; min-width: 200px; }
      .doctor-note.error { color: var(--danger); font-size: var(--fs-13); }
      @media (pointer: coarse) { .doctor-all > summary { min-height: 44px; display: flex; align-items: center; } }

      /* Settings → Notifications: this device's switch, what he tells you, when he stays silent. */
      .notify-row { gap: var(--sp-3); }
      .notify-row.wrap { flex-wrap: wrap; }
      .notify-row > .switch { flex: 1 1 240px; min-width: 0; align-items: flex-start; }
      .notify-row > .switch .track { margin-top: 2px; }
      .notify-hours { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
      .notify-time { width: 9.5em; max-width: 42vw; font-variant-numeric: tabular-nums; }
      .notify-count { width: 84px; font-variant-numeric: tabular-nums; }
      .notify-row .error, .notify-row + .item .error { font-size: var(--fs-12); color: var(--danger); }
      @media (pointer: coarse) { .notify-row > .switch { min-height: 44px; } }
      /* A switch that's on: its knob is the ink that reads on the track (in the dark the track is white, and a white knob vanished). */
      .switch input:checked + .track::after { background: var(--on-accent); }
      .doctor-more > summary { cursor: pointer; color: var(--text-3); width: fit-content; min-height: 24px; margin-bottom: var(--sp-2); }
      .doctor-more[open] > summary { margin-bottom: var(--sp-2); }
      @media (pointer: coarse) { .doctor-more > summary { min-height: 44px; display: flex; align-items: center; } }
      .aside-answer { min-height: 48px; }
      .aside-answer:empty { display: none; }
      .aside-answer > .md > :first-child { margin-top: 0; }
      .aside-answer > .md > :last-child { margin-bottom: 0; }
      .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); max-width: 620px; margin-top: var(--sp-4); }
      .suggestion { height: var(--control-h-sm); padding: 0 var(--sp-3); border-radius: var(--r-full); border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: var(--fs-13); font-weight: 500; transition: border-color var(--d-1) var(--ease-out), background-color var(--d-1); }
      .suggestion:hover { border-color: var(--border-strong); background: var(--surface-2); color: var(--text); }
      .chat-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2); margin: auto 0; padding: var(--sp-10) 0; }
      .chat-hero h2 { font-size: var(--fs-20); font-weight: 650; letter-spacing: -0.02em; }
      .hero-galahad { display: grid; place-items: center; margin-bottom: var(--sp-1); }
      .hero-galahad .worker-avatar { animation: emblem-in var(--d-sheet) var(--ease-out); }
      /* The orbs (ui/orb.ts): Galahad's field in gold in his heads-up ring, a knight's in its own colours, each drawn on a
         canvas its own size: still where it is one of many, moving slowly where it is the one you look at (lib/field-orb.ts). */
      .orb { display: inline-grid; place-items: center; flex: none; width: var(--orb-size); height: var(--orb-size); }
      .orb > svg, .orb > canvas { display: block; width: 100%; height: 100%; }
      /* What he asks you, under his orb (views/galahad-asks.ts): the Inbox's own cards, read left to right. */
      .galahad-asks { width: 100%; max-width: 640px; text-align: left; margin-top: var(--sp-2); }
      .chat-hero p { color: var(--text-2); max-width: 46ch; }

      /* ---------- timeline (ledger) ---------- */
      .timeline { display: flex; flex-direction: column; }
      .tl-day { position: sticky; top: calc(var(--topbar-h) + var(--safe-top)); z-index: 2; padding: var(--sp-2) var(--card-pad); background: var(--bg); font-size: var(--fs-12); font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--border); }
      .tl-item { display: grid; grid-template-columns: 22px 1fr auto; gap: var(--sp-3); padding: var(--row-pad) var(--card-pad); border-bottom: 1px solid var(--border); align-items: start; }
      .tl-item:last-child { border-bottom: 0; }
      /* Long lists: rows out of sight aren't laid out or painted until they're scrolled near. */
      .timeline > .tl-item, #memory-results .rows > .item { content-visibility: auto; contain-intrinsic-size: auto 96px; }
      .tl-item .tl-icon { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--tone-soft, var(--surface-2)); color: var(--tone, var(--text-3)); }
      .tl-item .tl-icon svg { width: 13px; height: 13px; }
      .tl-item .tl-main { min-width: 0; }
      .tl-item .tl-title { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
      .tl-item .tl-time { font-size: var(--fs-12); color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .tl-item details, .tl-item .meta { margin-top: var(--sp-1); }
      .tl-item details summary { cursor: pointer; color: var(--text-3); font-size: var(--fs-12); width: fit-content; }
      .tl-item details pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-md); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--font-mono); }

      /* ---------- fleet + sandboxes ---------- */
      .node-card { display: flex; flex-direction: column; }
      .node-card .node-head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--card-pad) var(--card-pad) var(--sp-3); }
      .node-card .node-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); flex: none; }
      .node-card .node-name { font-weight: 600; font-size: var(--fs-15); letter-spacing: -0.01em; }
      .node-card .node-sub { font-size: var(--fs-12); color: var(--text-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .node-card .node-body { padding: 0 var(--card-pad) var(--card-pad); display: flex; flex-direction: column; gap: var(--section-gap); }
      .node-card .loads { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
      .node-card .load-label { display: flex; justify-content: space-between; font-size: var(--fs-12); color: var(--text-3); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
      /* A node's capacity: what it measured, the ceiling, its slots. Label, value, action; one column on a phone. */
      .capacity { display: flex; flex-direction: column; gap: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--border); }
      .capacity .cap-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: var(--sp-2) var(--sp-3); align-items: start; font-size: var(--fs-13); }
      .capacity .cap-label { font-size: var(--fs-12); color: var(--text-3); padding-top: 1px; }
      .capacity .cap-value { min-width: 0; overflow-wrap: anywhere; }
      .capacity .cap-action { margin: -5px -6px 0 0; }
      .capacity .chip { font-variant-numeric: tabular-nums; }
      .capacity .cap-facts { margin-top: calc(-1 * var(--sp-1)); }
      .capacity details summary { cursor: pointer; color: var(--text-3); font-size: var(--fs-12); width: fit-content; }
      .capacity details ul, .plain-list { margin: 0; padding-left: 18px; color: var(--text-2); display: flex; flex-direction: column; gap: var(--sp-1); }
      .capacity details ul { margin-top: var(--sp-2); }
      .capacity details ul { font-size: var(--fs-12); }
      .pips { display: inline-flex; gap: 3px; align-items: center; }
      .pips > span { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--border-strong); }
      .pips > span.on { background: var(--accent-fill); border-color: transparent; }
      .work-attempts { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
      @media (max-width: 480px) {
        .capacity .cap-row { grid-template-columns: minmax(0, 1fr) auto; }
        .capacity .cap-label { grid-column: 1 / -1; }
      }
      .place-rank { display: flex; flex-direction: column; gap: var(--sp-2); }
      .place-row { display: grid; grid-template-columns: 22px 1fr auto; gap: var(--sp-3); align-items: center; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
      .place-row.first { border-color: var(--accent-border); background: var(--accent-soft); }
      .place-row .rank { font: 600 12px/1 var(--font-mono); color: var(--text-3); text-align: center; }
      .place-row.first .rank { color: var(--accent); }
      .best-fit { color: var(--accent); font-size: var(--fs-12); font-weight: 600; }
      .place-row.rejected { background: transparent; border-style: dashed; color: var(--text-3); }
      /* A card that opens on request: one line (with what it's about) until it's wanted. */
      .disclosure > summary { display: flex; align-items: center; gap: var(--sp-2); min-height: 48px; padding: var(--sp-2) var(--card-pad); cursor: pointer; list-style: none; font-size: var(--fs-13); font-weight: 550; color: var(--text-2); border-radius: var(--r-lg); flex-wrap: wrap; }
      .disclosure > summary::-webkit-details-marker { display: none; }
      .disclosure > summary:hover { color: var(--text); }
      .disclosure > summary .chev { color: var(--text-3); transition: transform var(--d-2) var(--ease-out); }
      .disclosure[open] > summary .chev { transform: rotate(90deg); }
      .disclosure > .disclosure-body { display: grid; gap: var(--sp-2); padding: 0 var(--card-pad) var(--card-pad); }
      /* A list in it: edge to edge, under a hairline. */
      .disclosure.flush > .disclosure-body { display: block; padding: 0; border-top: 1px solid var(--border); }
      .net-explain { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3); border-radius: var(--r-md); background: var(--tone-soft); border: 1px solid color-mix(in srgb, var(--tone) 22%, transparent); font-size: var(--fs-13); }
      .net-explain > svg { color: var(--tone); margin-top: 1px; }
      .console { display: flex; flex-direction: column; border: 1px solid var(--border-strong); border-radius: var(--r-lg); overflow: hidden; background: #060607; color: #e4e4e8; }
      .console .console-out { min-height: 160px; max-height: 50vh; overflow: auto; padding: var(--sp-3); font: 12.5px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
      .console .console-out .cmd { color: #ffffff; font-weight: 600; }
      .console .console-out .err { color: #ff8f8f; }
      .console .console-out .sys { color: #85858e; }
      .console .console-in { display: flex; align-items: center; gap: var(--sp-2); border-top: 1px solid #1f1f23; padding: 6px 6px 6px 12px; background: #0d0d0f; }
      .console .console-in span { color: #ffffff; font: 600 13px var(--font-mono); }
      .console .console-in input { flex: 1; min-width: 0; height: 32px; border: 0; outline: none; background: none; color: #ededef; font: var(--fs-input-mono) var(--font-mono); }
      .console .console-in input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
      .console .console-in .btn { --btn-bg: #17171a; --btn-fg: #ededef; --btn-border: #2e2e33; }

      /* ---------- welcome / pairing ---------- */
      .solo { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(var(--sp-6) + var(--safe-top)) var(--sp-4) calc(var(--sp-6) + var(--safe-bottom)); background: radial-gradient(1200px 600px at 50% -10%, var(--glow), transparent 60%), var(--bg); }
      .solo-card { width: min(460px, 100%); display: flex; flex-direction: column; gap: var(--sp-5); animation: page-in var(--d-3) var(--ease-out); }
      .solo-card .card { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4); }
      .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2); }
      /* The emblem in a breath of starlight (welcome, pairing, an empty chat). */
      .hero-mark { position: relative; display: grid; place-items: center; margin-bottom: var(--sp-3); }
      .hero-mark::before { content: ""; position: absolute; inset: -70%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-hero), transparent); pointer-events: none; }
      .hero-mark .emblem { position: relative; animation: emblem-in var(--d-sheet) var(--ease-out); }
      @keyframes emblem-in { from { opacity: 0; transform: translateY(4px) scale(0.97); } }
      .hero h1 { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.022em; }
      .hero p { color: var(--text-2); max-width: 40ch; }
      .steps-num { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-3); counter-reset: s; }
      .steps-num li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: var(--sp-3); align-items: start; font-size: var(--fs-13); color: var(--text-2); }
      .steps-num li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-12); font-weight: 600; color: var(--text); }
      .steps-num li > div { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; min-width: 0; }
      .solo-foot { text-align: center; font-size: var(--fs-12); color: var(--text-3); display: flex; flex-direction: column; gap: 4px; align-items: center; }
      .trust-strip { display: flex; gap: var(--sp-4); justify-content: center; flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-12); }
      .trust-strip span { display: inline-flex; gap: 6px; align-items: center; }
      .trust-strip svg { width: 14px; height: 14px; }

      /* ---------- misc ---------- */
      /* The app's own icon, in About. */
      .about-icon { flex: none; border-radius: 10px; }
      .scope-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: var(--sp-2); }
      /* An invite's QR code: white paper whatever the theme (a camera needs the contrast), big enough to scan across a desk. */
      .invite-qr { align-self: center; width: min(240px, 72vw); aspect-ratio: 1; padding: 0; border-radius: var(--r-md); background: #fff; box-shadow: var(--shadow-1); overflow: hidden; }
      .invite-qr svg { display: block; width: 100%; height: 100%; }
      .scope { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); font-size: var(--fs-13); }
      .scope svg { margin-top: 2px; }
      label.scope { cursor: pointer; }
      .scope.on svg { color: var(--ok); }
      .scope.off { background: transparent; border-style: dashed; color: var(--text-3); }
      .scope .scope-name { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text); }
      .scope.off .scope-name { color: var(--text-3); }
      .autonomy { display: flex; flex-direction: column; }
      .autonomy .a-row { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-3); align-items: center; padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); font-size: var(--fs-13); }
      .autonomy .a-row:first-child { border-top: 0; }
      .help-list { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-13); align-items: center; }
      .help-list .keys { display: flex; gap: 3px; justify-content: flex-end; }
      .reorder { display: flex; flex-direction: column; gap: 6px; }
      .reorder .r-item { display: flex; align-items: center; gap: var(--sp-2); padding: 4px 4px 4px 10px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
      .reorder .r-item .r-index { font: 600 11px var(--font-mono); color: var(--text-3); width: 16px; }
      .reorder .r-item:first-child { border-color: var(--accent-border); }
      .reorder .r-item:first-child .r-index { color: var(--accent); }
      /* Words Galahad (or an agent) wrote, shown as a quotation: data, never instructions. */
      .quote { padding: 2px 0 2px 12px; border-left: 2px solid var(--border-strong); color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
      /* A tool's answer or a receipt: verbatim, scrollable, never parsed. */
      /* A kept picture, previewed: never wider than its sheet, on sunken ground (a transparent one shows its edges). */
      .preview-img { max-width: 100%; height: auto; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--bg-sunken); }
      /* Long text in a box of its own height that scrolls (an archived entry's description). */
      .scroll-box { max-height: 420px; overflow: auto; }
      .result { margin: 0; padding: 10px 12px; max-height: 50vh; overflow: auto; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-md); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--font-mono); color: var(--text); }
      .notice-strip { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-12); color: var(--text-3); }
      .notice-strip svg { width: 14px; height: 14px; }
      .flow { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-12); color: var(--text-2); }
      .flow .node-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
      .flow .node-pill svg { width: 14px; height: 14px; }
      .flow .arrow { color: var(--text-3); }
      .flow .blocked { color: var(--danger); text-decoration: line-through; text-decoration-thickness: 1px; }
      @media (max-width: 639px) {
        .flow { flex-direction: column; align-items: flex-start; gap: 2px; }
        .flow .arrow { transform: rotate(90deg); margin-left: 14px; line-height: 1; }
      }
      @media print { .sidebar, .topbar, .toaster { display: none !important; } }

      /* ---------- his skills: each a page of notes ---------- */
      .skills-budget { display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-12); }
      .skill-page { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
      .card.skill-page { padding: var(--sp-5) var(--sp-6); }
      .skill-head { display: flex; flex-direction: column; gap: var(--sp-2); padding-bottom: var(--sp-3); border-bottom: 1px solid var(--border); }
      .skill-head h3 { font-size: var(--fs-18); font-weight: 600; letter-spacing: -0.014em; line-height: 1.3; overflow-wrap: anywhere; }
      .skill-head .meta, .skill-origin .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); color: var(--text-3); font-size: var(--fs-12); }
      .skill-origin { display: flex; flex-direction: column; gap: 6px; }
      .skill-origin > p:first-child { line-height: 1.55; overflow-wrap: anywhere; max-width: 68ch; }
      .skill-head:not(:has(h3)) { padding-bottom: var(--sp-3); }
      .skill-part { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
      .skill-part h4 { font-size: var(--fs-13); font-weight: 600; color: var(--text-2); letter-spacing: 0.01em; }
      .skill-part > p, .skill-part li { line-height: 1.6; overflow-wrap: anywhere; max-width: 68ch; }
      .skill-part ol, .skill-part ul { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: var(--sp-2); }
      .skill-part ul.skill-proof, .skill-part ul.skill-record { list-style: none; padding-left: 0; }
      .skill-proof code { display: block; font: 12px/1.5 var(--font-mono); background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-md); padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .skill-proof .expect { color: var(--text-2); font-size: var(--fs-13); margin-top: 4px; }
      /* A skill taken in from elsewhere: its instructions as written there, as text, in a box of their own that scrolls. */
      .skill-body { margin: 0; font: 12.5px/1.6 var(--font-mono); background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 28rem; overflow: auto; font-variant-ligatures: none; }
      /* A command is read character by character: "=>" stays two characters, never a ligature. */
      .skill-proof code, #skill-proof { font-variant-ligatures: none; }
      .skill-record li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); font-size: var(--fs-13); color: var(--text-2); max-width: none; }
      .skill-record li .grow { flex: 1 1 12ch; min-width: 0; color: var(--text); }
      .skill-record li .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-2); color: var(--text-3); font-size: var(--fs-12); }
      .skill-waiting { padding-top: var(--sp-4); border-top: 1px solid var(--border); }
      .skill-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--border); }
      .skill-foot .grow { flex: 1 1 auto; }
      .skill-row-title { font-weight: 550; }
      .skill-row-when { font-size: var(--fs-13); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .skills-retired > .rows { border-top: 1px solid var(--border); }
      @media (max-width: 639px) { .card.skill-page { padding: var(--sp-4); } .skill-head h3 { font-size: var(--fs-16); } .skill-record li.skill-version .grow { flex-basis: 100%; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Galahad is starting"><img src="/knights/galahad-helm.webp" alt="" /></div>
    </div>
    <noscript><div class="solo"><div class="solo-card"><div class="card"><p>Galahad needs JavaScript enabled.</p></div></div></div></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
