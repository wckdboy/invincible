<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      "default", not "black-translucent": with a translucent status bar, iOS 26 draws its own blur
      (26.1+: a scrim) over the top of an installed app, and nothing on the page can turn it off.
      With "default" iOS paints an opaque status bar in the page's colour and the app starts below
      it. iOS reads this when the app is added to the Home Screen: an existing install keeps the
      old style until it's removed and added again.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Galahad" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Galahad: one mind, many bodies. Your autonomous knight and engineer." />
    <title>Galahad</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/boot.js"></script>
    <style>
      /* ==========================================================================
         Galahad design tokens. The full system is documented in docs/DESIGN.md.
         One token list for both themes via light-dark(); the theme override only
         flips color-scheme, so native controls and scrollbars follow too.
         ========================================================================== */
      /* Geist (SIL Open Font License, src/fonts/OFL.txt), its Latin set, one variable file for every weight. Served by the
         node; a first visit that hasn't got it yet in time keeps the system face rather than swapping under the reader. */
      @font-face {
        font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: optional;
        src: url("/fonts/geist.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        color-scheme: light dark;

        /* Canvas + surfaces: true neutrals, black and white with nothing in between but grey */
        --bg: light-dark(#fafafa, #08080a);
        --bg-sunken: light-dark(#f3f3f4, #050506);
        --sidebar: light-dark(#f5f5f6, #0b0b0d);
        --surface: light-dark(#ffffff, #111113);
        --surface-2: light-dark(#f4f4f5, #17171a);
        --surface-3: light-dark(#ebebed, #1f1f23);
        --surface-glass: light-dark(rgb(250 250 250 / 0.8), rgb(8 8 10 / 0.72));
        --overlay: light-dark(rgb(10 10 12 / 0.3), rgb(0 0 0 / 0.66));
        --border: light-dark(#e6e6e8, #212125);
        --border-strong: light-dark(#d4d4d8, #2e2e33);

        /* Text */
        --text: light-dark(#0a0a0b, #ededef);
        --text-2: light-dark(#52525a, #a1a1a9);
        --text-3: light-dark(#696971, #8b8b94);

        /* Accent: ink. White on dark, black on light; reserved for the owner, focus and the one primary action */
        --accent: light-dark(#0a0a0b, #ffffff);
        --accent-fill: light-dark(#0c0c0e, #e4e4e8);
        --accent-fill-top: light-dark(#3a3a3f, #ffffff);
        --accent-fill-hover: light-dark(#26262a, #f4f4f6);
        --accent-soft: light-dark(rgb(10 10 11 / 0.05), rgb(255 255 255 / 0.07));
        --accent-border: light-dark(rgb(10 10 11 / 0.24), rgb(255 255 255 / 0.26));
        --on-accent: light-dark(#ffffff, #0a0a0b);
        --focus: light-dark(#0a0a0b, #ffffff);

        /* The Crest (the emblem): faint facets, lit from the star above */
        --em-lit: light-dark(#3a3a3d, #ffffff);
        --em-mid: light-dark(#1c1c1e, #f1f1f3);
        --em-deep: light-dark(#000000, #d4d4d9);
        --em-shade: light-dark(#1a1a1c, #e2e2e6);
        --em-mid-shade: light-dark(#0c0c0d, #cdcdd3);
        --em-shade-deep: light-dark(#000000, #b4b4bc);
        --em-base: light-dark(#0c0c0d, #cdcdd3);
        /* Starlight: the faint glow at the top of the canvas */
        --glow: light-dark(rgb(10 10 11 / 0.045), rgb(255 255 255 / 0.065));
        --glow-hero: light-dark(rgb(10 10 11 / 0.07), rgb(255 255 255 / 0.12));

        /* What is going on at the Roundtable (lib/knight-state.ts), one colour each and the Apple app's too (Brand.swift):
           blue at work, amber for what waits on you (and only that), red for a failure; green (--ok) for what ended and is
           new to you. No pair can be mistaken with full colour vision, light or dark; the words beside them say the rest. */
        --work: light-dark(#0a5fcc, #58a6ff);
        --needs: light-dark(#946200, #f0b549);
        --failed: light-dark(#c4141b, #ff6b6b);
        /* Galahad's seat at the Round Table (icon("roundtable")): the red of the cross on his helm, brighter on black */
        --siege: light-dark(#c4141b, #ee2c36);

        /* Semantic tones (status, trust, verdict, network risk): the only colour, kept for meaning */
        --ok: light-dark(#137a43, #4cc38a);
        --ok-soft: light-dark(#e8f4ed, #11221a);
        --warn: light-dark(#965a00, #f0b549);
        --warn-soft: light-dark(#fbf2e2, #261f13);
        --danger: light-dark(#c4281c, #ff7a7a);
        --danger-soft: light-dark(#fcedeb, #2a1618);
        --danger-fill: light-dark(#c4281c, #c42b2b);
        --info: light-dark(#3f3f46, #c8c8d0);
        --info-soft: light-dark(#f1f1f3, #16161a);
        --agent: light-dark(#27272a, #e4e4e8);
        --agent-soft: light-dark(#ececee, #1b1b1f);

        /* Elevation */
        --shadow-1: 0 1px 2px light-dark(rgb(16 16 24 / 0.05), rgb(0 0 0 / 0.35));
        --shadow-2: 0 1px 3px light-dark(rgb(16 16 24 / 0.06), rgb(0 0 0 / 0.35)), 0 8px 24px light-dark(rgb(16 16 24 / 0.08), rgb(0 0 0 / 0.45));
        --shadow-3: 0 2px 8px light-dark(rgb(16 16 24 / 0.08), rgb(0 0 0 / 0.4)), 0 24px 64px light-dark(rgb(16 16 24 / 0.16), rgb(0 0 0 / 0.6));
        --ring-inset: inset 0 1px 0 light-dark(rgb(255 255 255 / 0.6), rgb(255 255 255 / 0.04));
        /* Alerts (a toast, the banner): a precise surface over whatever is under it; its hairline edge is light on a dark
           page and ink on a light one (it carries the tone, mixed in), and on a dark page its top edge catches the light */
        --alert-bg: light-dark(#ffffff, #101012);
        --alert-line: light-dark(rgb(10 10 12 / 0.12), rgb(255 255 255 / 0.11));
        --alert-lit: light-dark(rgb(255 255 255 / 0), rgb(255 255 255 / 0.06));
        /* What floats over the page (a toast, the banner): the same surface, opaque until the page can be blurred under it */
        --alert-glass: var(--alert-bg);

        /* Type */
        --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        --font-mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
        --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px; --fs-16: 16px;
        --fs-18: 18px; --fs-20: 20px; --fs-24: 24px; --fs-30: 30px; --fs-40: 40px;
        --fs-body: 14px;
        --fs-input: 14px;
        --fs-input-mono: 13px; /* a monospace face reads larger at the same size */

        /* Space, radii, sizes */
        --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;
        /* The rhythm: what each kind of box takes from the scale, so every page is spaced alike (docs/DESIGN.md). */
        --page-gap: var(--sp-6);     /* a page's head and its sections, apart */
        --section-gap: var(--sp-3);  /* a section's head and what is in it; the blocks inside it */
        --card-pad: var(--sp-4);     /* a card's content from its edge: its head, rows and foot too, so their leading edges line up */
        --row-pad: var(--sp-3);      /* above and below a list row's text (and a card's head and foot) */
        --form-gap: var(--sp-4);     /* the fields of a form, apart */
        --field-gap: var(--sp-2);    /* a field's label, its control and its hint */
        --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;
        --control-h: 34px;
        --control-h-sm: 28px;
        --topbar-h: 52px;
        --sidebar-w: 268px;
        /* The phone's tab bar went (26 November 2026: Home is Galahad, "…" holds the rest): nothing is kept clear for it. */
        --tabbar-h: 0px;
        --page-max: 1120px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);

        /* Motion (docs/DESIGN.md, Motion): fast ease-out on transform and opacity; the apps take the same numbers. */
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        /* Leaving: it gathers speed as it goes (a toast dropping away, a dialog closing), so nothing waits on it. */
        --ease-exit: cubic-bezier(0.4, 0, 1, 1);
        /* A short spring for what opens over the page: response 0.4 s, damping 0.72 (SwiftUI's .spring(response: 0.4,
           dampingFraction: 0.72); Compose's spring(dampingRatio = 0.72f, stiffness = 246.7f)), sampled over --d-spring:
           3.8 % past its mark at most, settled by its end. */
        --ease-spring: linear(0, 0.027, 0.095, 0.188, 0.295, 0.405, 0.513, 0.613, 0.703, 0.781, 0.847, 0.901, 0.944, 0.977, 1.001, 1.018, 1.029, 1.036, 1.038, 1.038, 1.036, 1.033, 1.029, 1.025, 1.021, 1.017, 1.013, 1.01, 1.007, 1.005, 1.003, 1.001, 1);
        --d-1: 120ms; --d-2: 180ms; --d-3: 240ms; --d-sheet: 380ms;
        /* An alert coming into focus (a toast, the banner) · the spring's length · one slow breath of something new
           that needs you, once · one pass of the banner's line of light as it tries again. (Where motion is reduced the
           breath and the line are taken away, not quickened.) */
        --d-enter: 420ms; --d-spring: 500ms; --d-breath: 2400ms; --d-sweep: 2600ms;
      }
      /* Where the browser can blur what is under it, a floating alert is a material: the page shows through it, blurred,
         at 14 to 16 % (so its words keep 4.5:1 whatever is under it, white or black). Opaque where less transparency is
         asked for. */
      @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
        :root { --alert-glass: light-dark(rgb(255 255 255 / 0.84), rgb(16 16 18 / 0.86)); --alert-blur: blur(20px) saturate(1.6); }
      }
      @media (prefers-reduced-transparency: reduce) { :root { --alert-glass: var(--alert-bg); --alert-blur: none; } }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      :root[data-motion="reduce"] { --d-1: 0.01ms; --d-2: 0.01ms; --d-3: 0.01ms; --d-sheet: 0.01ms; --d-enter: 0.01ms; --d-spring: 0.01ms; }
      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion="full"]) { --d-1: 0.01ms; --d-2: 0.01ms; --d-3: 0.01ms; --d-sheet: 0.01ms; --d-enter: 0.01ms; --d-spring: 0.01ms; }
      }
      @media (pointer: coarse) { :root { --control-h: 44px; --control-h-sm: 36px; } }
      @media (max-width: 959px) { :root { --fs-body: 15px; } }
      /* A field the keyboard opens for is at least 16px on a touch screen or at a phone's width: iOS zooms the page into a smaller one. */
      @media (max-width: 959px), (pointer: coarse) { :root { --fs-input: 16px; --fs-input-mono: 16px; } }

      /* ---------- base ---------- */
      *, *::before, *::after { box-sizing: border-box; }
      /* touch-action: a double tap never zooms the page, so a quick second tap on a control is a tap; pinching still zooms. */
      /* scrollbar-gutter: where a scrollbar takes room (not on a phone or a Mac), its place is kept, so a page that grows
         past the window doesn't narrow under you. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; touch-action: manipulation; scrollbar-gutter: stable; }
      body {
        margin: 0; min-height: 100%; color: var(--text);
        background: radial-gradient(1100px 520px at 60% -200px, var(--glow), transparent 70%) no-repeat, var(--bg);
        font: var(--fs-body)/1.5 var(--font-sans); font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent; overflow-x: hidden;
      }
      button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
      button { cursor: pointer; }
      /* Holding one of the app's own controls does nothing, as in an app: no link preview, no "Open in Safari", no label
         selected (Safari reads only the prefixed user-select). */
      .btn, .sidebar a, .work-row, .home-filter, .selector-trigger { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
      a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
      h1, h2, h3, h4, p { margin: 0; }
      img, svg { display: block; }
      svg.icon { flex: none; }
      svg.icon .icon-siege { fill: var(--siege); }
      ::selection { background: color-mix(in srgb, var(--accent-fill) 28%, transparent); }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
      [hidden] { display: none !important; }
      .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      /* Figures that change keep their width: counts, times, badges ("3 chats", "2 min ago"). */
      .tnum, .badge, time { font-variant-numeric: tabular-nums; }
      .mono { font-family: var(--font-mono); font-size: 0.92em; }
      .muted { color: var(--text-2); }
      /* Words that report something gone wrong (a trial's false "done"), in the danger tone. */
      .danger-text { color: var(--danger); }
      .warn-text { color: var(--warn); }
      /* A link that reads as the words around it (the top bar's "Answering"). */
      .plain-link { color: inherit; text-decoration: none; }
      .text-end { text-align: end; }
      /* The thing a quieter passage is about (a confirmation's memory or skill), in the text's own colour. */
      .plain { color: var(--text); }
      .subtle { color: var(--text-3); }
      .small { font-size: var(--fs-13); }
      .tiny { font-size: var(--fs-12); }
      .strong { font-weight: 600; }
      .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .wrap-anywhere { overflow-wrap: anywhere; }
      .pre-wrap { white-space: pre-wrap; }
      .grow { flex: 1 1 auto; min-width: 0; }
      .flex-none { flex: none; }
      .row { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
      .row.wrap { flex-wrap: wrap; }
      .row.top { align-items: flex-start; }
      .row.between { justify-content: space-between; }
      .row.end { justify-content: flex-end; }
      /* Centred, words and rows alike (a pairing's code and its answer). */
      .centered { text-align: center; justify-content: center; }
      .row.tight { gap: var(--sp-1); }
      .stack { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
      .stack.tight { gap: var(--sp-2); }
      .stack.snug { gap: var(--sp-1); }
      /* A column of sections (the Overview's, Activity's) is spaced as a page is. */
      .stack.loose { gap: var(--page-gap); }
      /* What's in a form or a sheet is spaced as a form's fields are, whichever stack it was given. */
      form.stack, form.stack.tight, form.stack.loose, .sheet-body .stack.loose { gap: var(--form-gap); }
      .spacer { flex: 1; }
      kbd, .kbd {
        display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
        font: 500 11px/1 var(--font-sans); color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
        border-bottom-width: 2px; border-radius: 5px;
      }

      /* ---------- boot screen (before JS) ---------- */
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot img { width: 56px; height: 56px; opacity: 0.92; animation: boot-breathe 1.6s var(--ease-in-out) infinite alternate; }
      @keyframes boot-breathe { from { transform: scale(0.96); opacity: 0.55; } to { transform: scale(1); opacity: 0.95; } }
      :root[data-motion="reduce"] .boot img { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .boot img { animation: none; } }

      /* ---------- shell ---------- */
      .shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main-col { min-width: 0; display: flex; flex-direction: column; }
      .topbar {
        position: sticky; top: 0; z-index: 20; height: calc(var(--topbar-h) + var(--safe-top));
        padding: var(--safe-top) calc(var(--sp-4) + var(--safe-right)) 0 calc(var(--sp-4) + var(--safe-left));
        display: flex; align-items: center; gap: var(--sp-2);
        /* Solid, as the status bar above it is: frosted, what scrolled under it showed through as a haze. */
        background: var(--bg);
      }
      .topbar .title { font-weight: 600; font-size: var(--fs-15); letter-spacing: -0.01em; transition: opacity var(--d-2) var(--ease-out), transform var(--d-2) var(--ease-out); }
      .topbar .title.tucked { opacity: 0; transform: translateY(4px); }
      .topbar .brand-mini { display: flex; align-items: center; gap: var(--sp-2); }
      main.view {
        flex: 1; width: 100%; outline: none;
        padding: var(--sp-5) calc(var(--sp-4) + var(--safe-right)) calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-8)) calc(var(--sp-4) + var(--safe-left));
      }
      /* The way back to Home on a page (a phone's top bar): a chevron and the app's mark. */
      .topbar .brand-mini img { width: 22px; height: 22px; border-radius: 6px; }
      .btn.side-expand { display: none; }

      @media (min-width: 960px) {
        .shell { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
        /* Folded away (the head's button, or [): the work's pane takes the width, and a button at its top brings it back. */
        :root[data-sidebar="collapsed"] .shell { grid-template-columns: minmax(0, 1fr); }
        :root[data-sidebar="collapsed"] .sidebar { display: none; }
        :root[data-sidebar="collapsed"] .btn.side-expand { display: inline-flex; position: fixed; z-index: 25; top: var(--sp-2); left: var(--sp-2); }
        main.view { padding: var(--sp-6) var(--sp-8) var(--sp-12); }
        .topbar { padding: 0 var(--sp-6) 0 var(--sp-8); }
        /* The sidebar has the way home, search and everything else. */
        .topbar .brand-mini, .topbar .topbar-search, .topbar .places-button, .topbar .fleet-pill { display: none; }
        .shell[data-sidebar-none] { grid-template-columns: minmax(0, 1fr); }
        .shell[data-sidebar-none] .topbar :is(.brand-mini, .topbar-search, .places-button) { display: inline-flex; }
        .sidebar {
          display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; height: 100dvh; min-width: 0;
          background: var(--sidebar); border-right: 1px solid var(--border); padding: var(--sp-3) var(--sp-2) var(--sp-2); overflow: hidden;
        }
      }

      /* ---------- the sidebar (a wide screen): the mark, search, Galahad pinned, the work by attention, its foot ---------- */
      .side-head { display: flex; align-items: center; gap: 2px; min-height: 32px; padding: 0 2px 0 var(--sp-2); }
      .side-mark { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; height: 32px; color: var(--text); text-decoration: none; }
      .side-mark img { flex: none; width: 20px; height: 20px; border-radius: 5px; }
      .wordmark-text { font-size: var(--fs-12); font-weight: 650; letter-spacing: 0.2em; text-transform: uppercase; }
      .search-trigger {
        display: flex; align-items: center; gap: var(--sp-2); width: 100%; height: 32px; padding: 0 var(--sp-2) 0 10px;
        border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--text-3); font-size: var(--fs-13);
        box-shadow: var(--shadow-1); transition: border-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out);
      }
      .search-trigger:hover { border-color: var(--border-strong); color: var(--text-2); }
      .search-trigger .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .search-trigger .kbds { margin-left: auto; display: flex; gap: 2px; }
      .side-search { flex: none; margin: var(--sp-2) 0 var(--sp-3); }
      /* Galahad, pinned: his orb, his name, his line; it opens his own conversation. */
      .side-galahad {
        flex: none; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 0 10px; margin-bottom: var(--sp-1);
        padding: 9px 8px 9px 10px; border-radius: var(--r-lg); background: var(--surface); color: var(--text); text-decoration: none;
        box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border); -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        transition: box-shadow var(--d-1) var(--ease-out), background-color var(--d-1) var(--ease-out);
      }
      .side-galahad:hover { box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border-strong); }
      .side-galahad:active { background: var(--surface-2); }
      .side-galahad[aria-current="page"] { box-shadow: var(--shadow-1), inset 0 0 0 1px var(--accent-border); }
      .side-galahad-orb { display: grid; place-items: center; width: 34px; height: 34px; }

      .side-label[data-tone="needs"] { color: var(--needs); }

        display: flex; align-items: center; gap: 6px; width: 100%; min-height: 30px; margin-top: 2px; padding: 0 var(--sp-2); border: 0; border-radius: var(--r-md);
        background: none; color: var(--text-3); font: inherit; font-size: var(--fs-12); font-weight: 600; text-align: left;
        transition: background-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out);
      }

      .side-inbox { display: flex; align-items: center; gap: var(--sp-2); min-height: 34px; padding: 0 9px; border-radius: var(--r-md); color: var(--text); text-decoration: none; font-size: var(--fs-13); font-weight: 500; }
      .side-inbox:hover, .side-inbox:active, .side-inbox.is-current { background: var(--surface-3); }
      .side-inbox > svg { color: var(--text-3); }
      .side-empty, .side-note { padding: var(--sp-2) var(--sp-2) var(--sp-3); color: var(--text-3); font-size: var(--fs-12); line-height: 1.5; }
      .side-empty p { margin-bottom: var(--sp-2); }

      .side-pill {
        display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 128px; height: 26px; padding: 0 9px; border: 1px solid var(--border); border-radius: var(--r-full);
        color: var(--text-2); font-size: var(--fs-12); font-weight: 500; text-decoration: none; transition: border-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out);
      }
      .side-pill:hover { border-color: var(--border-strong); color: var(--text); }
      .side-pill > svg { flex: none; color: var(--text-3); }

      /* ---------- the work's rows (views/work-rows.ts): a task in three lines, as T3 Code's sidebar has it ---------- */
      .work-row {
        display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 7px 9px 8px; border-radius: var(--r-md); color: var(--text); text-decoration: none;
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: background-color var(--d-1) var(--ease-out);
      }
      .work-row:hover, .work-row:active { background: var(--surface-3); }
      .work-row[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border); }
      .work-l1, .work-l3 { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-12); line-height: 16px; color: var(--text-3); }
      .work-l2 { font-size: var(--fs-13); font-weight: 550; line-height: 18px; letter-spacing: -0.005em; color: var(--text); }
      .work-badge {
        flex: none; display: grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; background: var(--surface-3); color: var(--text-2);
        font-size: 9px; font-weight: 700; line-height: 1; box-shadow: inset 0 0 0 1px var(--border);
      }
      .work-badge.is-none { background: none; box-shadow: none; outline: 1px dashed var(--border-strong); outline-offset: -1px; }
      .work-project { flex: 0 1 auto; min-width: 0; }
      /* How it stands, in a word in its state's colour (the word says it: colour is never the only telling). */
      .work-word { flex: none; display: inline-flex; align-items: center; gap: 3px; margin-left: auto; font-weight: 600; color: var(--tone, var(--text-2)); }
      .work-age { flex: none; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
      /* A knight's orb where the work shows it (ui/orb.ts knightFace, still): sized here, as the face's own sheet is only
         given to the page with a seat's. */
      :is(.work-row, .need, .thread-page, .td, .thread-said-by) .knight-orb { display: block; flex: none; width: var(--orb-size, 16px); height: var(--orb-size, 16px); }
      :is(.work-row, .need, .thread-page, .td, .thread-said-by) .knight-orb > :is(svg, canvas) { display: block; width: 100%; height: 100%; }
      .work-knight { flex: none; color: var(--text-2); }
      .work-detail { min-width: 0; }
      .work-detail.mono { font-family: var(--font-mono); font-size: 11.5px; }
      /* At work, quietly (it needs nothing from you): its title and its orb fade, its words keep their contrast. */
      .work-row[data-attention="working"]:not([aria-current="page"]):not(:hover) .work-l2 { color: var(--text-2); font-weight: 500; }
      .work-row[data-attention="working"]:not([aria-current="page"]):not(:hover) .knight-orb { opacity: 0.62; }

      /* ---------- Home (views/home.ts): Galahad, what needs you, the work, his message box ---------- */
      .shell[data-pane="home"] { --topbar-h: 0px; }
      .shell[data-pane="home"] .topbar { display: none; }
      .shell[data-pane="home"] main.view { padding: 0; }
      .home { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; max-width: 760px; margin: 0 auto; }
      .home-head {
        position: sticky; top: 0; z-index: 20; flex-wrap: nowrap; align-items: center; gap: var(--sp-3); margin: 0;
        padding: calc(var(--safe-top) + var(--sp-3)) calc(var(--sp-4) + var(--safe-right)) var(--sp-3) calc(var(--sp-4) + var(--safe-left));
        background: var(--bg);
      }
      .home-wait { height: 240px; margin: var(--sp-2) calc(var(--sp-3) + var(--safe-right)) 0 calc(var(--sp-3) + var(--safe-left)); border-radius: var(--r-xl); }
      .home-body[hidden] { display: none; }
      .home-body { display: flex; flex-direction: column; flex: 1; }
      .home-who { display: flex; align-items: center; gap: var(--sp-3); flex: 1; min-width: 0; color: inherit; text-decoration: none; }
      .home-orb { flex: none; display: grid; place-items: center; width: 48px; height: 48px; }
      .home-name { min-width: 0; }
      .home-head h1 { font-size: var(--fs-20); letter-spacing: -0.02em; line-height: 1.15; }
      .home-line { margin-top: 2px; font-size: var(--fs-13); color: var(--text-3); }
      .home-line[data-tone="needs"] { color: var(--needs); }
      .home-line[data-tone="accent"] { color: var(--work); }
      .home-line[data-tone="ok"] { color: var(--ok); }
      .home-chip {
        flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 112px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r-full);
        background: var(--surface); color: var(--text-2); font-size: var(--fs-12); font-weight: 500; text-decoration: none;
      }
      .home-chip:hover { border-color: var(--border-strong); color: var(--text); }
      .home-head > .btn { flex: none; }
      /* What needs you: amber, only while something waits, each with its answer in place (views/needs.ts). */
      /* (Its surface, edge and light are the alerts' .alert-card, in amber.) */
      .home-needs { margin: 0 calc(var(--sp-3) + var(--safe-right)) var(--sp-5) calc(var(--sp-3) + var(--safe-left)); }
      .home-needs[hidden] { display: none; }
      .home-needs-head { display: flex; align-items: center; gap: var(--sp-2); padding: 12px 14px 2px; font-size: var(--fs-13); font-weight: 600; color: var(--needs); }
      .need { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 12px; }
      .need + .need { border-top: 1px solid var(--border); }
      .need-who { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font-size: var(--fs-12); color: var(--text-3); }
      .need-who > .knight-orb { flex: none; }
      .need-icon { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); }
      .need-what { font-size: var(--fs-14); line-height: 1.4; overflow-wrap: anywhere; }
      .need-what .mono { font-size: var(--fs-13); }
      .need-target { color: var(--text-2); }
      .need-note { font-size: var(--fs-12); color: var(--text-3); }
      .need-note.is-warn { color: var(--warn); }
      .need-acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: 6px; }
      .need-acts > .btn { border-radius: var(--r-full); padding-inline: 14px; }
      .need-acts > .btn.icon-only { padding-inline: 0; }
      .need-outcome:empty { display: none; }
      .home-work { display: flex; flex-direction: column; flex: 1; }
      .home-work-head { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; padding: 0 calc(var(--sp-4) + var(--safe-right)) var(--sp-2) calc(var(--sp-4) + var(--safe-left)); }
      .home-work-head h2 { flex: none; font-size: var(--fs-14); font-weight: 650; }
      .home-filters { display: flex; justify-content: flex-end; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
      .home-filters::-webkit-scrollbar { display: none; }
      .home-filter {
        flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border: 1px solid var(--border); border-radius: var(--r-full);
        background: var(--surface); color: var(--text-2); font: inherit; font-size: var(--fs-12); font-weight: 500; white-space: nowrap;
      }
      .home-filter:first-child { padding-left: 10px; }
      .home-filter[aria-pressed="true"] { border-color: transparent; background: var(--accent-fill); color: var(--on-accent); }
      .home-filter[aria-pressed="true"] .work-badge { background: color-mix(in srgb, var(--on-accent) 18%, transparent); color: var(--on-accent); box-shadow: none; }
      .home-work-rows > .work-row, .home-work-rows > .home-fold {
        border-radius: 0; border-top: 1px solid var(--border); padding: 10px calc(var(--sp-4) + var(--safe-right)) 11px calc(var(--sp-4) + var(--safe-left));
      }
      .home-fold { display: flex; align-items: center; gap: var(--sp-2); width: 100%; min-height: 44px; border: 0; background: none; color: var(--text-3); font: inherit; font-size: var(--fs-13); font-weight: 550; text-align: left; }
      .home-fold:active { background: var(--surface-3); }
      .home-empty, .home-note { padding: var(--sp-6) calc(var(--sp-4) + var(--safe-right)) var(--sp-6) calc(var(--sp-4) + var(--safe-left)); border-top: 1px solid var(--border); color: var(--text-3); font-size: var(--fs-14); line-height: 1.5; }
      .home-empty p { max-width: 52ch; margin-bottom: var(--sp-3); }
      /* His message box, docked at the foot; the list fades out under it. */
      .home-dock {
        position: sticky; bottom: 0; z-index: 15; margin-top: auto; pointer-events: none;
        padding: var(--sp-8) calc(var(--sp-3) + var(--safe-right)) calc(var(--safe-bottom) + var(--sp-3)) calc(var(--sp-3) + var(--safe-left));
        background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 58%);
      }
      .home-dock > * { pointer-events: auto; }
      .home-dock-problem:empty { display: none; }
      .home-dock-problem { margin-bottom: var(--sp-2); }
      .home-composer {
        display: flex; align-items: flex-end; gap: 4px; padding: 5px; border: 1px solid var(--border-strong); border-radius: 26px; background: var(--surface); box-shadow: var(--shadow-2);
        transition: border-color var(--d-1) var(--ease-out);
      }
      .home-composer:focus-within { border-color: var(--focus); }
      .home-composer textarea {
        flex: 1; min-width: 0; min-height: 40px; max-height: 160px; padding: 9px 4px; border: 0; outline: none; background: none; resize: none;
        color: var(--text); font: inherit; font-size: var(--fs-input); line-height: 22px; field-sizing: content;
      }
      .home-composer > .btn { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; }
      :root[data-keyboard="open"] .home-dock { padding-bottom: var(--sp-2); }
      @media (min-width: 960px) {
        .home-head { padding-top: var(--sp-6); }
        .home-needs { margin-left: var(--sp-4); margin-right: var(--sp-4); }
        .home-dock { padding-left: var(--sp-4); padding-right: var(--sp-4); }
      }

      /* A way back to the roster, where a timeline is the whole screen. (Two classes: .btn would show it.) */
      .btn.pane-back { display: none; }
      /* A timeline (his, a knight's, a room's) has no top bar and no bar under it: its header is whose it is. */
      .shell[data-pane="timeline"] { --topbar-h: 0px; --tabbar-h: 0px; }
      .shell[data-pane="timeline"] .topbar { display: none; }
      @media (max-width: 959px) {
        .btn.pane-back { display: inline-flex; }
      }

      .avatar {
        flex: none; width: 28px; height: 28px; border-radius: var(--r-md); display: grid; place-items: center;
        background: var(--surface-3); color: var(--text-2);
      }
      .avatar.agent { background: var(--accent-soft); color: var(--accent); }
      .avatar.agent.orb-avatar { background: none; }
      /* A toned avatar: a notice's severity, a run's status, a tool's class. */
      .avatar[data-tone] { background: var(--tone-soft); color: var(--tone); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--tone) 18%, transparent); }

      .fleet-pill {
        display: inline-flex; align-items: center; gap: var(--sp-2); height: 28px; padding: 0 10px; border-radius: var(--r-full);
        border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: var(--fs-12); font-weight: 500;
        text-decoration: none; white-space: nowrap;
      }
      .fleet-pill:hover { border-color: var(--border-strong); color: var(--text); }
      .activity-pill { padding-right: var(--sp-1); }
      .topbar .actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-1); }

      /* The banner: Galahad can't be reached, or this device is offline, then for a moment that he is reached again
         (ui/banner.ts). A thin capsule hanging under the top bar over the page; its place takes no room, so nothing under
         it moves when it comes or goes (--banner-top: where it hangs, the top bar's foot unless a page without one says).
         Offline is grey, no error; can't reach him is amber, and while the app tries again one slow line of light runs
         along its foot; reached again it turns green where it is. Nothing blinks. */
      .banner { position: sticky; top: calc(var(--safe-top) + var(--banner-top, var(--topbar-h))); z-index: 21; height: 0; display: flex; align-items: flex-start; justify-content: center; pointer-events: none; }
      .banner-pill {
        position: relative; display: flex; align-items: center; gap: var(--sp-2); width: min(600px, calc(100% - 2 * var(--sp-4))); margin-top: var(--sp-2);
        min-height: 36px; padding: 3px 4px 3px 12px; border-radius: 18px; overflow: hidden; pointer-events: auto;
        color: var(--text); font-size: var(--fs-13); line-height: 1.35;
        background: var(--alert-glass); -webkit-backdrop-filter: var(--alert-blur, none); backdrop-filter: var(--alert-blur, none);
        border: 1px solid color-mix(in oklab, var(--tone, var(--text-3)) 30%, var(--alert-line));
        box-shadow: inset 0 1px 0 var(--alert-lit), var(--shadow-2);
        transition: transform var(--d-spring) var(--ease-spring), opacity var(--d-enter) var(--ease-out), filter var(--d-enter) var(--ease-out), border-color var(--d-3) var(--ease-out);
      }
      @media (pointer: coarse) { .banner-pill { min-height: 44px; } }
      /* Home has its own header in place of the top bar: the banner hangs under it. */
      .shell[data-pane="home"] { --banner-top: calc(2 * var(--sp-3) + 48px); }
      @media (min-width: 960px) { .shell[data-pane="home"] { --banner-top: calc(var(--sp-6) + var(--sp-3) + 48px); } }
      /* (One width while it is up, whatever it says: centred, a capsule that grew or shrank would move on the page.) */
      .banner-pill:not(:has(.btn)) { padding-right: 14px; }
      .banner-pill[data-said="reconnected"] { justify-content: center; }
      .banner-pill[data-said="reconnected"] .banner-text { flex: none; }
      .banner-pill > svg { flex: none; color: var(--tone, var(--text-2)); transition: color var(--d-3) var(--ease-out); }
      .banner-text { flex: 1; min-width: 0; padding: 4px 0; }
      .banner-pill .btn { flex: none; border-radius: var(--r-full); }
      /* Coming: dropping in a few pixels, out of a slight blur. Going: a short fade, up and away. */
      .banner-pill.entering { opacity: 0; transform: translateY(-8px) scale(0.98); filter: blur(4px); }
      .banner-pill.leaving { opacity: 0; transform: translateY(-6px); transition: transform var(--d-2) var(--ease-exit), opacity var(--d-2) var(--ease-exit); }
      /* Trying again: one slow pass of light along its foot as it comes, and again at each Retry (ui/banner.ts), then
         still; taken away where motion is reduced. */
      .banner-pill[data-trying]::after {
        content: ""; position: absolute; left: 0; bottom: 0; width: 40%; height: 1px; pointer-events: none;
        background: linear-gradient(90deg, transparent, var(--tone), transparent); transform: translateX(-100%);
        animation: banner-sweep var(--d-sweep) var(--ease-in-out) 1 both;
      }
      @keyframes banner-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      :root[data-motion="reduce"] .banner-pill[data-trying]::after { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .banner-pill[data-trying]::after { animation: none; } }

      /* ---------- page scaffolding ---------- */
      /* Navigation is frequent, so pages appear instantly (no enter animation). */
      .page { max-width: var(--page-max); margin: 0 auto; display: flex; flex-direction: column; gap: var(--page-gap); }
      .page.narrow { max-width: 760px; }
      /* A placeholder with nothing in it yet (a note, a status line) takes no room and adds no gap. Skeletons and
         live regions stay: one holds a place, the other must exist before it speaks. */
      :is(.page, .page-body-parts, .stack, .sheet-body) > div:empty:not(.skeleton):not([role]):not([aria-live]) { display: none; }
      /* A page's body appears whole (pageBody()): its parts at the page's gap, one placeholder until they've all answered. */
      .page-body, .page-body-parts { display: flex; flex-direction: column; gap: var(--page-gap); min-width: 0; }
      .page-body-wait { height: min(480px, 60vh); border-radius: var(--r-lg); }
      @keyframes page-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .page-head { display: flex; align-items: flex-end; gap: var(--sp-4); flex-wrap: wrap; }
      .page-head h1 { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.022em; line-height: 1.2; }
      .page-head .lede { color: var(--text-2); margin-top: var(--sp-1); max-width: 64ch; }
      .page-head .actions { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }
      @media (max-width: 639px) { .page-head .actions { margin-left: 0; } }
      /* Search and one filter control, side by side: the list starts right under them. */
      .filter-bar { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
      .filter-bar > .input-wrap { flex: 1 1 auto; min-width: 0; }
      .filter-bar > .selector-trigger { flex: 0 1 auto; height: var(--control-h); max-width: 60%; }
      .section { display: flex; flex-direction: column; gap: var(--section-gap); min-width: 0; }
      .section-head { display: flex; align-items: center; gap: var(--sp-2); min-height: 28px; }
      .section-head h2 { font-size: var(--fs-13); font-weight: 600; color: var(--text-2); letter-spacing: 0.01em; }
      .section-head .count-label { color: var(--text-3); font-size: var(--fs-12); }
      .section-head .actions { margin-left: auto; display: flex; gap: var(--sp-1); align-items: center; }
      /* A section's note belongs to its heading: just under it, and the section's gap after. */
      .section > .section-head + .note { margin-top: calc(var(--sp-1) - var(--section-gap)); }
      h3 { font-size: var(--fs-15); font-weight: 600; letter-spacing: -0.01em; }

      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1), var(--ring-inset);
        min-width: 0;
      }
      /* What's in a padded card is a stack at the section's gap, unless it says otherwise (a row, a tighter stack). */
      .card.pad { padding: var(--card-pad); }
      :where(.card.pad) { display: flex; flex-direction: column; gap: var(--section-gap); }
      .card.flat { box-shadow: none; }
      .card.accent { border-color: var(--accent-border); box-shadow: var(--shadow-1), 0 0 0 3px color-mix(in srgb, var(--accent-fill) 8%, transparent); }
      .card.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); }
      .card.danger { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
      .card-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--row-pad) var(--card-pad); border-bottom: 1px solid var(--border); min-height: 48px; }
      .card-head h3 { font-size: var(--fs-14); }
      .card-body { padding: var(--card-pad); }
      .card-foot { display: flex; align-items: center; gap: var(--sp-2); padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); background: var(--bg-sunken); border-radius: 0 0 var(--r-lg) var(--r-lg); }
      .grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
      .grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
      .grid.stats { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
      .two-col { display: grid; gap: var(--sp-6); grid-template-columns: 1fr; }
      @media (min-width: 1100px) { .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); } }

      /* ---------- list rows ---------- */
      .rows { display: flex; flex-direction: column; }
      /* A row's layout (listRow()): a lead, its text, a trail. In a list it has the row's padding and a hairline above; alone
         (a card's head: a loop, a node) it is just the layout. */
      .item { display: flex; gap: var(--sp-3); align-items: flex-start; min-width: 0; }
      .item.center { align-items: center; }
      .rows > .item { display: flex; gap: var(--sp-3); padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); min-width: 0; align-items: flex-start; }
      .rows > .item:first-child { border-top: 0; }
      .rows > .item.center { align-items: center; }
      /* A whole row that opens something (an artifact). */
      .rows > .item-button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border); font: inherit; color: inherit; cursor: pointer; align-items: center; }
      .rows > .item-button:first-child { border-top: 0; }
      .rows > .item-button:hover { background: var(--surface-2); }
      /* Pressed: what a finger is on answers at once, before the tap lands (app.ts gives iOS the touch listener it
         needs to show :active at all). */
      .rows > a.item { color: inherit; text-decoration: none; transition: background-color var(--d-1) var(--ease-out); }
      .rows > a.item:active, .rows > .item-button:active { background: var(--surface-3); }
      .suggestion { transition: background-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out); }
      .suggestion:active { transform: scale(0.97); }
      @media (max-width: 959px) { .work-row:active { transform: scale(0.99); } }
      /* A whole row that goes to a place (More's index, a node on the Overview). */
      .rows > a.item { color: inherit; text-decoration: none; }
      .rows > a.item:hover { background: var(--surface-2); }
      .rows > a.item:first-child { border-radius: var(--r-lg) var(--r-lg) 0 0; }
      .rows > a.item:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
      /* A row's text (listRow): its title, the line under it, its meta line; 2 px apart, as the lines of one thing. */
      .item-text { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .item-title { font-weight: 550; }
      .item-sub { color: var(--text-2); font-size: var(--fs-13); }
      .item-text > .meta { margin-top: 2px; }
      .item-body { margin-top: calc(var(--sp-2) - 2px); }
      .rows > .item .meta { margin-top: var(--sp-1); }
      .rows > .item .item-text > .meta { margin-top: 2px; }
      /* In a stack, a meta line takes the stack's gap. */
      .rows > .item .stack > .meta { margin-top: 0; }
      .rows > .item .item-actions { display: flex; gap: var(--sp-1); align-items: center; flex: none; }
      /* A folder's line in a list of files (artifacts.ts): quieter, on sunken ground. */
      .rows > .item.dir-row { align-items: center; gap: var(--sp-2); padding-top: var(--sp-2); padding-bottom: var(--sp-2); background: var(--bg-sunken); color: var(--text-3); font: var(--fs-12)/1.5 var(--font-mono); }
      /* A fact of yours (about-you.ts): its words across the row's width, whose it is and its answers under them. */
      .item.fact { flex-direction: column; align-items: stretch; gap: var(--sp-2); }
      .rows > .item > .item-chevron { flex: none; color: var(--text-3); }
      /* A setting's row: on a narrow screen its control goes under its words. */
      .rows > .item.wrap { flex-wrap: wrap; }
      .rows > .item.wrap > .item-text { flex-basis: 200px; }
      /* Small facts side by side (meta()): quiet type, tabular figures, so a time or a count changing doesn't move them. */
      .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); min-width: 0; color: var(--text-3); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
      /* A line about what's near it (note()): a section, a list, a form. */
      .note { color: var(--text-3); font-size: var(--fs-12); line-height: 1.5; }
      /* An icon beside a line of text, level with its first line. */
      .line-icon { flex: none; padding-top: 3px; color: var(--text-3); }
      .rows > .note { padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); }
      /* A form's actions (formActions()), at its end, the primary one last. */
      .form-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--sp-2); }
      @media (hover: hover) {
        .rows > .item .reveal { opacity: 0; transition: opacity var(--d-1) var(--ease-out); }
        .rows > .item:hover .reveal, .rows > .item:focus-within .reveal { opacity: 1; }
      }

      /* ---------- buttons ---------- */
      .btn {
        --btn-bg: var(--surface); --btn-fg: var(--text); --btn-border: var(--border-strong);
        position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        height: var(--control-h); padding: 0 var(--sp-3); border-radius: var(--r-md);
        border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-fg);
        font-size: var(--fs-13); font-weight: 550; white-space: nowrap; text-decoration: none; user-select: none;
        box-shadow: var(--shadow-1); transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1) var(--ease-out), color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out), opacity var(--d-1);
      }
      .btn:hover { --btn-bg: var(--surface-2); }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
      .btn.primary {
        --btn-bg: var(--accent-fill); --btn-fg: var(--on-accent); --btn-border: transparent;
        background: linear-gradient(180deg, var(--accent-fill-top), var(--btn-bg));
        box-shadow: var(--shadow-1), inset 0 1px 0 rgb(255 255 255 / 0.14), 0 0 0 1px color-mix(in srgb, var(--accent-fill) 60%, transparent);
      }
      .btn.primary:hover { --btn-bg: var(--accent-fill-hover); }
      .btn.danger { --btn-fg: var(--danger); }
      .btn.danger:hover { --btn-bg: var(--danger-soft); --btn-border: color-mix(in srgb, var(--danger) 35%, transparent); }
      .btn.danger-solid { --btn-bg: var(--danger-fill); --btn-fg: #fff; --btn-border: transparent; }
      .btn.danger-solid:hover { --btn-bg: color-mix(in srgb, var(--danger-fill) 88%, black); }
      .btn.ghost { --btn-bg: transparent; --btn-border: transparent; box-shadow: none; color: var(--text-2); }
      .btn.ghost:hover { --btn-bg: var(--surface-3); color: var(--text); }
      .btn.sm { height: var(--control-h-sm); padding: 0 10px; font-size: var(--fs-12); border-radius: var(--r-sm); gap: 5px; }
      .btn.lg { height: 42px; padding: 0 var(--sp-5); font-size: var(--fs-14); border-radius: 10px; }
      .btn.icon-only { width: var(--control-h); padding: 0; }
      .btn.sm.icon-only { width: var(--control-h-sm); }
      .btn.block { width: 100%; }
      .btn .spinner { width: 14px; height: 14px; }
      .btn[aria-busy="true"] > :not(.spinner) { opacity: 0.6; }
      .btn-group { display: inline-flex; gap: var(--sp-2); flex-wrap: wrap; }

      .spinner { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.7s linear infinite; opacity: 0.8; flex: none; }
      .spinner.sm { width: 12px; height: 12px; }
      .spinner.xs { width: 10px; height: 10px; border-width: 1.5px; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- badges, chips, dots, counts ---------- */
      /* Tones come from [data-tone] (or an ancestor); components only supply fallbacks. */
      .badge {
        display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--r-full);
        background: var(--tone-soft, var(--surface-2)); color: var(--tone, var(--text-2)); font-size: var(--fs-12); font-weight: 550; white-space: nowrap; line-height: 1;
        border: 1px solid color-mix(in srgb, var(--tone, var(--text-2)) 14%, transparent);
      }
      .badge svg { width: 12px; height: 12px; }
      .badge.outline { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
      [data-tone="ok"] { --tone: var(--ok); --tone-soft: var(--ok-soft); }
      [data-tone="warn"] { --tone: var(--warn); --tone-soft: var(--warn-soft); }
      [data-tone="danger"] { --tone: var(--danger); --tone-soft: var(--danger-soft); }
      [data-tone="info"] { --tone: var(--info); --tone-soft: var(--info-soft); }
      [data-tone="accent"] { --tone: var(--accent); --tone-soft: var(--accent-soft); }
      [data-tone="agent"] { --tone: var(--agent); --tone-soft: var(--agent-soft); }
      [data-tone="neutral"] { --tone: var(--text-2); --tone-soft: var(--surface-2); }
      [data-tone="needs"] { --tone: var(--needs); --tone-soft: color-mix(in srgb, var(--needs) 12%, transparent); }
      [data-tone="work"] { --tone: var(--work); --tone-soft: color-mix(in srgb, var(--work) 10%, transparent); }
      [data-tone="failed"] { --tone: var(--failed); --tone-soft: color-mix(in srgb, var(--failed) 10%, transparent); }
      /* Words in their tone (an action class beside a tool's name). */
      .toned { color: var(--tone); }
      /* A state's dot is a small orb of its colour, lit from above (your word, 24 November 2026: everything orbs); one
         for something going on is lit, a soft ring of its light round it, and still: nothing moves at rest (26 November
         2026: only the orb you look at moves). */
      .dot {
        position: relative; width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block;
        background: radial-gradient(circle at 34% 30%, color-mix(in oklab, var(--tone, var(--text-3)), white 55%) 0, var(--tone, var(--text-3)) 55%, color-mix(in oklab, var(--tone, var(--text-3)), black 28%) 100%);
      }
      .dot:not([data-tone]) { --tone: var(--text-3); }
      .dot.live { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone, var(--text-3)) 22%, transparent), 0 0 8px 1px color-mix(in srgb, var(--tone, var(--text-3)) 45%, transparent); }
      .count {
        display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-full);
        background: var(--accent-fill); color: var(--on-accent); font-size: 11px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums;
      }
      .count.quiet { background: var(--surface-3); color: var(--text-2); }
      /* What waits on you, amber (count(n, false, "needs")): dark figures on it on a dark page, white on a light one. */
      .count[data-tone="needs"] { background: var(--needs); color: light-dark(#ffffff, #1c1405); }
      /* A count that changes rolls to its new figure (ui/controls.ts setCount): up as it grows, down as it shrinks. */
      .count { position: relative; overflow: hidden; }
      .count > .count-was { position: absolute; inset: 0; display: grid; place-items: center; }
      .count[data-roll="up"] > .count-is { animation: count-in-up var(--d-3) var(--ease-out); }
      .count[data-roll="up"] > .count-was { animation: count-out-up var(--d-3) var(--ease-out) forwards; }
      .count[data-roll="down"] > .count-is { animation: count-in-down var(--d-3) var(--ease-out); }
      .count[data-roll="down"] > .count-was { animation: count-out-down var(--d-3) var(--ease-out) forwards; }
      @keyframes count-in-up { from { transform: translateY(80%); opacity: 0; } }
      @keyframes count-out-up { to { transform: translateY(-80%); opacity: 0; } }
      @keyframes count-in-down { from { transform: translateY(-80%); opacity: 0; } }
      @keyframes count-out-down { to { transform: translateY(80%); opacity: 0; } }
      /* Something new that needs you: one slow breath of its light, once, never a loop (ui/controls.ts arrive()); taken
         away where motion is reduced. A dot's light swells from it and fades; a count's glows round it and settles. */
      .dot[data-arrived]::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--tone, var(--needs)); pointer-events: none; animation: arrive-halo var(--d-breath) var(--ease-in-out) 1 both; }
      @keyframes arrive-halo { 0% { transform: scale(1); opacity: 0; } 35% { transform: scale(2.4); opacity: 0.34; } 100% { transform: scale(3); opacity: 0; } }
      .count[data-arrived] { animation: arrive-glow var(--d-breath) var(--ease-in-out) 1; }
      @keyframes arrive-glow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--needs) 0%, transparent); } 35% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--needs) 30%, transparent); } }
      /* A card that holds what needs you (Home's Needs-you cards, an approval in a thread): an alert's surface, its tone
         (data-tone, "needs" for amber) in its edge and a faint light at its head. arrive() breathes its edge once. */
      .alert-card {
        border-radius: var(--r-xl); color: var(--text);
        background: radial-gradient(240px 90px at 24px 0, var(--tone-soft, transparent), transparent), var(--alert-bg);
        border: 1px solid color-mix(in oklab, var(--tone, var(--text-3)) 26%, var(--alert-line));
        box-shadow: inset 0 1px 0 var(--alert-lit), var(--shadow-1);
      }
      .alert-card[data-arrived] { animation: arrive-ring var(--d-breath) var(--ease-in-out) 1; }
      @keyframes arrive-ring {
        0%, 100% { box-shadow: inset 0 1px 0 var(--alert-lit), var(--shadow-1), 0 0 0 0 color-mix(in srgb, var(--tone, var(--needs)) 0%, transparent); }
        35% { box-shadow: inset 0 1px 0 var(--alert-lit), var(--shadow-1), 0 0 0 4px color-mix(in srgb, var(--tone, var(--needs)) 22%, transparent); }
      }
      :root[data-motion="reduce"] .dot[data-arrived]::after, :root[data-motion="reduce"] .count[data-arrived], :root[data-motion="reduce"] .alert-card[data-arrived] { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .dot[data-arrived]::after, :root:not([data-motion="full"]) .count[data-arrived], :root:not([data-motion="full"]) .alert-card[data-arrived] { animation: none; } }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--sp-2); border-radius: var(--r-sm);
        background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: var(--fs-12); font-weight: 500; white-space: nowrap;
      }
      .chip svg { width: 13px; height: 13px; color: var(--text-3); }
      .chip.on { color: var(--text); }
      .chip.on svg { color: var(--ok); }
      button.chip { cursor: pointer; transition: background-color var(--d-1) var(--ease-out), border-color var(--d-1), color var(--d-1); }
      button.chip:hover { border-color: var(--border-strong); color: var(--text); }
      button.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
      button.chip[aria-pressed="true"] svg { color: var(--accent); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-12); border: 1px solid var(--border); }
      button.tag { cursor: pointer; }
      button.tag:hover { color: var(--accent); border-color: var(--accent-border); }

      /* ---------- forms ---------- */
      .field { display: flex; flex-direction: column; gap: var(--field-gap); min-width: 0; }
      .field > label, .label { font-size: var(--fs-13); font-weight: 550; color: var(--text); }
      .field .hint { font-size: var(--fs-12); color: var(--text-3); }
      .field .error { font-size: var(--fs-12); color: var(--danger); }
      .fields { display: grid; gap: var(--form-gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
      .input, .select, .textarea {
        width: 100%; min-width: 0; height: var(--control-h); padding: 0 10px; border-radius: var(--r-md);
        border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--fs-input);
        box-shadow: var(--shadow-1); transition: border-color var(--d-1) var(--ease-out), box-shadow var(--d-1) var(--ease-out);
      }
      .textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
      /* A select as wide as its choices, beside other things (a tool's class). */
      .select.fit { width: auto; flex: none; }
      /* The MCP library (views/mcp-library.ts): its tools on one line where they fit, a server's line at most two. */
      .library-tools > .input[type="search"] { flex: 1 1 220px; }
      .library-tools > .select { width: auto; flex: 1 1 140px; max-width: 260px; }
      .library-line { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
      .input::placeholder, .textarea::placeholder { color: var(--text-3); }
      .input:hover, .select:hover, .textarea:hover { border-color: color-mix(in srgb, var(--text-3) 60%, var(--border-strong)); }
      .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      .input:disabled, .select:disabled, .textarea:disabled { opacity: 0.55; cursor: not-allowed; }
      .input.mono { font-family: var(--font-mono); font-size: var(--fs-input-mono); }
      .input-wrap { position: relative; display: flex; align-items: center; }
      .input-wrap > svg { position: absolute; left: 10px; color: var(--text-3); pointer-events: none; }
      .input-wrap > .input { padding-left: 34px; }
      .secret-field { position: relative; }
      .secret-field .input { padding-left: 34px; letter-spacing: 0.08em; font-family: var(--font-mono); }
      .secret-field .input::placeholder { font-family: var(--font-sans); letter-spacing: normal; }
      /* A pasted key is never shown back, not even by the browser's own reveal button. */
      input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
      .secret-field > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); }

      .segmented {
        position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; isolation: isolate; max-width: 100%;
      }
      .segmented .thumb {
        position: absolute; z-index: -1; top: 2px; bottom: 2px; left: 0; border-radius: 8px; background: var(--surface);
        box-shadow: var(--shadow-1), inset 0 0 0 1px var(--border); transition: transform var(--d-3) var(--ease-out), width var(--d-3) var(--ease-out);
      }
      .segmented button {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--control-h) - 6px); padding: 0 var(--sp-3);
        border: 0; background: none; border-radius: 8px; color: var(--text-2); font-size: var(--fs-13); font-weight: 550; white-space: nowrap;
        transition: color var(--d-1) var(--ease-out);
      }
      .segmented button:hover { color: var(--text); }
      .segmented button:disabled { color: var(--text-3); opacity: 0.6; cursor: not-allowed; }
      .segmented button[aria-checked="true"] { color: var(--text); }
      .segmented button[aria-checked="true"] svg { color: var(--seg-tone, var(--accent)); }
      .segmented.block { display: grid; width: 100%; }
      .segmented.sm button { height: calc(var(--control-h-sm) - 4px); font-size: var(--fs-12); padding: 0 10px; }

      .switch { position: relative; display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; min-height: 32px; }
      .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .switch-text { display: flex; flex-direction: column; min-width: 0; }
      .switch .track { position: relative; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background-color var(--d-2) var(--ease-out), border-color var(--d-2); }
      .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: transform var(--d-2) var(--ease-out); }
      .switch input:checked + .track { background: var(--accent-fill); border-color: transparent; }
      .switch input:checked + .track::after { transform: translateX(14px); }
      .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
      .switch input:disabled + .track { opacity: 0.5; }

      .range { display: flex; flex-direction: column; gap: 6px; }
      .range .range-top { display: flex; justify-content: space-between; align-items: baseline; }
      .range output { font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--fs-13); }
      .range input[type="range"] { width: 100%; height: 24px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; --fill: 50%; }
      .range input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent-fill) var(--fill), var(--surface-3) var(--fill)); }
      .range input[type="range"]::-moz-range-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent-fill) var(--fill), var(--surface-3) var(--fill)); }
      .range input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
      .range input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); }
      .range input[type="range"]:focus-visible { outline: none; }
      .range input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); }
      .range .scale { display: flex; justify-content: space-between; font-size: var(--fs-11); color: var(--text-3); font-variant-numeric: tabular-nums; }

      .chip-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: var(--control-h); padding: 4px 6px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); cursor: text; }
      .chip-input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
      .chip-input input { flex: 1; min-width: 100px; border: 0; outline: none; background: none; height: 24px; font-size: var(--fs-input); }
      .chip-input .tag button { border: 0; background: none; padding: 0 0 0 4px; color: var(--text-3); display: inline-flex; }
      .chip-input .tag button:hover { color: var(--danger); }

      /* ---------- callouts, states ---------- */
      /* What a part of a page wants you to know (ui/controls.ts callout(); the reach card is one): as an alert is drawn, its
         tone in its edge and in a faint light behind its mark, on the surface it sits on, never a tinted slab. */
      .callout {
        display: flex; gap: 10px; align-items: flex-start; padding: var(--sp-3) var(--sp-3) var(--sp-3) 14px; border-radius: var(--r-lg);
        background: radial-gradient(150px 64px at 22px 20px, var(--tone-soft, var(--info-soft)), transparent), var(--surface);
        border: 1px solid color-mix(in oklab, var(--tone, var(--info)) 26%, var(--border)); color: var(--text); font-size: var(--fs-13);
      }
      .callout > svg { color: var(--tone, var(--info)); margin-top: 1px; }
      .callout .callout-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
      .callout .callout-title { font-weight: 600; }
      .callout.quiet { background: var(--surface-2); border-color: var(--border); --tone: var(--text-3); }
      .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2); padding: var(--sp-10) var(--sp-4); color: var(--text-2); }
      .empty .empty-icon { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); margin-bottom: var(--sp-1); }
      .empty h3 { color: var(--text); font-size: var(--fs-15); }
      .empty p { max-width: 44ch; font-size: var(--fs-13); }
      .empty .btn-group { margin-top: var(--sp-2); justify-content: center; }
      .empty.compact { padding: var(--sp-6) var(--sp-4); }
      .skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r-sm); }
      .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, light-dark(rgb(255 255 255 / 0.6), rgb(255 255 255 / 0.04)), transparent); animation: shimmer 1.4s infinite; }
      :root[data-motion="reduce"] .skeleton::after { animation: none; }
      @media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) .skeleton::after { animation: none; } }
      @keyframes shimmer { to { transform: translateX(100%); } }
      .sk-line { height: 12px; }
      .sk-avatar { flex: none; width: 28px; height: 28px; border-radius: var(--r-md); }
      .sk-block { border-radius: var(--r-lg); }
      .sk-row { display: flex; gap: var(--sp-3); align-items: center; padding: var(--row-pad) var(--card-pad); border-top: 1px solid var(--border); }
      .sk-row:first-child { border-top: 0; }

      /* ---------- stat tiles, meters ---------- */
      .stat { padding: var(--card-pad); display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: border-color var(--d-1) var(--ease-out), transform var(--d-1) var(--ease-out); }
      a.stat:hover { border-color: var(--border-strong); }
      .stat .stat-label { display: flex; align-items: center; gap: 6px; font-size: var(--fs-12); font-weight: 550; color: var(--text-2); }
      .stat .stat-label svg { width: 14px; height: 14px; color: var(--text-3); }
      .stat .stat-value { font-size: var(--fs-24); font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .stat .stat-value .of { color: var(--text-3); font-weight: 500; font-size: var(--fs-16); }
      .stat .stat-note { font-size: var(--fs-12); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
      /* On a wider screen a figure's note keeps two lines, so one that comes in a line longer when its part answers moves
         nothing: a tile whose note did made its row of tiles taller, and everything under it moved (22 November 2026). */
      @media (min-width: 640px) {
        .grid.stats .stat .stat-note { min-height: 2lh; align-items: flex-start; }
        .grid.stats .stat .stat-note > .dot { margin-top: calc((1lh - 8px) / 2); }
      }
      /* On a phone the figures stay, smaller and tighter: the lists under them reach the first screen. */
      @media (max-width: 639px) {
        .grid.stats { gap: var(--sp-2); grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stat { padding: var(--sp-3); gap: 2px; }
        .stat .stat-value { font-size: var(--fs-20); }
        .stat .stat-value .of { font-size: var(--fs-14); }
        .stat .stat-note { line-height: 1.35; }
        .stat-skeleton { height: 86px; }
      }
      .stat-skeleton { height: 110px; border-radius: var(--r-lg); }
      .meter { position: relative; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
      .meter > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--tone, var(--accent-fill)); transform-origin: left; }
      /* The usage meter (views/usage-meter.ts): its tile opens what the calls came to; its bar stands still. */
      .usage-tile { cursor: pointer; }
      .usage-tile .stat-note { display: grid; gap: 6px; }
      .kv { display: grid; margin: 0; grid-template-columns: max-content 1fr; gap: 6px var(--sp-4); font-size: var(--fs-13); align-items: baseline; }
      .kv dt { color: var(--text-3); }
      .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

      /* ---------- copy fields, codes ---------- */
      .copyfield { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-sunken); overflow: hidden; }
      .copyfield code { flex: 1; min-width: 0; padding: 9px 12px; font: 13px/1.5 var(--font-mono); overflow-wrap: anywhere; user-select: all; }
      .copyfield .btn { border-radius: 0; border: 0; border-left: 1px solid var(--border-strong); height: auto; box-shadow: none; }
      .sas { display: flex; justify-content: center; gap: 6px; margin: var(--sp-2) 0; min-width: 0; }
      .sas span {
        display: grid; place-items: center; flex: 1 1 0; min-width: 0; max-width: 44px; aspect-ratio: 44 / 56; border-radius: 10px; background: var(--surface); border: 1px solid var(--accent-border);
        font: 650 clamp(20px, 6.5vw, 28px)/1 var(--font-mono); color: var(--accent); box-shadow: var(--shadow-1); font-variant-numeric: tabular-nums;
      }
      .sas span:nth-child(3) { margin-right: 8px; }
      /* A device code to type elsewhere (signing in to a provider): large, spaced. */
      .device-code { font-size: 1.4em; letter-spacing: 0.08em; }
      @media (max-width: 639px) { .solo-card .card { padding: var(--sp-5); } }
      .ring { --p: 1; width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--accent-fill) calc(var(--p) * 360deg), var(--surface-3) 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); flex: none; }

      /* ---------- dialogs: centered on desktop, bottom sheet on phones ---------- */
      /* What opens over the page (ui/dialog.ts): the page behind dims and blurs; a centred one arrives on a short spring
         and closes quicker than it came, gathering speed (its resting state is where it starts and where it ends). One
         that does what can't be taken back (data-tone="danger") has its edge, a faint light at its head, its mark and
         its button in red. */
      dialog.sheet {
        padding: 0; border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text);
        width: min(560px, calc(100vw - 32px)); max-height: min(86vh, 860px); box-shadow: inset 0 1px 0 var(--alert-lit), var(--shadow-3); overflow: hidden;
        display: flex; flex-direction: column; opacity: 0; transform: translateY(8px) scale(0.97);
        transition: opacity var(--d-2) var(--ease-exit), transform var(--d-2) var(--ease-exit), overlay var(--d-2) allow-discrete, display var(--d-2) allow-discrete;
      }
