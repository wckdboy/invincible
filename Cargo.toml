[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.24"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/wckdboy/invincible"

[workspace.dependencies]
invincible-policy = { path = "crates/invincible-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
axum = "0.8"
# Bodies: `BytesMut` for the one place the API buffers a request (a body limit read chunk by chunk).
bytes = "1"
# rustls with the system's trust roots; SOCKS for Tor and SOCKS5 egress.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks"] }
toml = "0.9"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
# ring's ChaCha20-Poly1305 (already here, under rustls): 3-5x the default backend on Apple silicon,
# which matters for shard links (spec/cluster.md); the same algorithm, so the Noise vectors hold.
snow = { version = "0.10", features = ["ring-accelerated"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
qrcode = { version = "0.14", default-features = false }
base64 = "0.23"
sha2 = "0.11"
toml_edit = "0.25"
regex = "1"
futures-util = { version = "0.3", default-features = false }
ed25519-dalek = "3"
# LAN discovery (spec/discovery.md): mDNS/DNS-SD, its own thread, no async runtime.
mdns-sd = { version = "0.21", default-features = false }
# Local time for scheduled agent tasks.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Measured with bench/run.sh (the PR that added it has the numbers). Fat LTO and one codegen unit:
# the smallest and fastest binaries (thin LTO is 10% larger). Panics unwind: a bug in one bot's
# channel or one request's task is caught there and the rest keep running (`panic = "abort"`
# would save 20% of the size and take every bot and stream down with it). opt-level 3: `"s"`
# saves 20% but costs 30% on the gateway's added latency and the agent's turns.
[profile.release]
lto = true
codegen-units = 1
strip = true
