[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.11"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/wckdboy/invincible"

[workspace.dependencies]
invincible-policy = { path = "crates/invincible-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
axum = "0.8"
# rustls with the system's trust roots; SOCKS for Tor and SOCKS5 egress.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "socks"] }
toml = "0.9"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
snow = "0.10"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
qrcode = { version = "0.14", default-features = false }
base64 = "0.23"
sha2 = "0.11"
toml_edit = "0.25"
regex = "1"
futures-util = { version = "0.3", default-features = false }
ed25519-dalek = "3"
# Local time for scheduled agent tasks.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
