[package]
name = "autobot"
description = "The Autobot Agent: a self-hosted agent on Invincible Gateway, for a VPS or a desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
invincible = { path = "../invincible" }
invincible-policy.workspace = true
clap.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
futures-util.workspace = true
chrono.workspace = true
sha2.workspace = true
getrandom.workspace = true
similar = "2"
ignore = "0.4"
globset = "0.4"
regex = "1"
crossterm = "0.28"
unicode-width = "0.2"
# Discord's gateway is a websocket.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# TLS for IMAP and SMTP (email): the same rustls, ring and system roots reqwest and the
# websocket already use, so no new crates.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustix = { version = "1", features = ["termios", "event", "stdio", "fs", "process"] }
base64.workspace = true
# Images shown to the agent: decoded, downscaled and re-encoded before they are sent (only the
# four formats terminals hand over; no rayon, no other codecs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
# The benchmarks drive the terminal UI through a pseudo-terminal (the same crate, one more feature).
rustix = { version = "1", features = ["pty", "termios"] }

[lints]
workspace = true
