[package]
name = "invincible"
description = "Self-hosted AI node: intelligence that never relies solely on frontier labs, corporations or countries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
invincible-policy.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
bytes.workspace = true
reqwest.workspace = true
toml.workspace = true
getrandom.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
snow.workspace = true
hyper.workspace = true
hyper-util.workspace = true
qrcode.workspace = true
base64.workspace = true
sha2.workspace = true
toml_edit.workspace = true
regex.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
mdns-sd.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
# An engine's process group, killed with everything in it (the same crate autobot uses).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# A paused clock for tests of timeouts.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
