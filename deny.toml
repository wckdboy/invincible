# cargo-deny: licenses, advisories and sources of every dependency.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "BSL-1.0"]
# BSL-1.0 (Boost, permissive): clipboard-win and error-code, under rustyline, Windows only.
# Only the licenses dependencies actually use; widen deliberately when a new one appears.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are not published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
