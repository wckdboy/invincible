# Every push and pull request: format, lints, tests (including the spec conformance vectors) and
# cargo-deny, on Linux and macOS (the two node platforms).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@8632757d5a758c452f724e9d837848c694a7bb48 # 1.91.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Rent is easy to skip if a later filter lands. This step is the rent suite and the
      # sidecar (real rclone against the in-test S3 mock) on their own.
      - run: cargo test -p invincible --test rent --test sidecar --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The installer against a fake release server on loopback (signed with a test key): fresh, the
  # same again, upgrade, back with --version, edge, interrupted, concurrent, a bad signature,
  # uninstall, purge. Stand-in programs and service managers; nothing to build. On Linux the
  # generated systemd units are checked by systemd-analyze too.
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh tests/install/test.sh
      - run: sh tests/install/test.sh
      - if: runner.os == 'Linux'
        name: systemd units
        run: |
          for scope in user system; do
            d=$(mktemp -d)
            for f in crates/invincible/tests/snapshots/*."$scope".service; do
              name=$(basename "$f" ".$scope.service").service
              sed -e 's#^ExecStart=[^ ]*#ExecStart=/usr/bin/true#' "$f" > "$d/$name"
            done
            if [ "$scope" = user ]; then
              for f in crates/invincible/tests/snapshots/invincible-update.*; do
                sed -e 's#^ExecStart=[^ ]*#ExecStart=/usr/bin/true#' "$f" > "$d/$(basename "$f")"
              done
            fi
            ls "$d"
            out=$(systemd-analyze verify --man=no "$d"/* 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -Ei 'unknown (key|section)|invalid|failed to parse|bad'; then exit 1; fi
          done
      - if: runner.os == 'macOS'
        run: plutil -lint crates/invincible/tests/snapshots/*.plist

  # The one-line installer, as a fresh VPS or desktop runs it: builds this commit, installs
  # llama.cpp (the pinned upstream build on Linux, Homebrew on macOS), then checks the commands.
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - run: sh install.sh --yes --no-setup
        env:
          # This commit, not the latest release.
          INVINCIBLE_FROM_SOURCE: "1"
          INVINCIBLE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          invincible --version
          autobot --version
          autobot doctor || true
          test -x "$HOME/.invincible/llama.cpp/llama-server" || command -v llama-server
      # The background services, for real: systemd user units on Linux, launchd agents on macOS.
      - name: services
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo loginctl enable-linger "$USER"
            XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_RUNTIME_DIR
            for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          fi
          autobot service install
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:7777/health && break; sleep 2; done
          curl -sf http://127.0.0.1:7777/health
          # The agent API answers through the gateway once both run.
          token=$(cat "$HOME/.invincible/token")
          for _ in $(seq 1 30); do curl -sf -H "authorization: Bearer $token" http://127.0.0.1:7777/v1/agent && break; sleep 2; done
          curl -sf -H "authorization: Bearer $token" http://127.0.0.1:7777/v1/agent
          curl -sf http://127.0.0.1:7777/healthz
          curl -sf http://127.0.0.1:7792/healthz
          autobot service status
          # Again: converges; the services keep running (the binaries did not change).
          INVINCIBLE_FROM_SOURCE=1 INVINCIBLE_REF=${{ github.event.pull_request.head.sha || github.sha }} sh install.sh --no-setup
          # (Reloaded if its PATH changed: give it a moment.)
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:7777/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:7777/healthz
          autobot service status
          autobot doctor || true
          autobot service uninstall
      - if: failure()
        run: |
          cat "$HOME/.invincible/logs/gateway.log" "$HOME/.autobot/logs/agent.log" 2>/dev/null | tail -40 || true
          ls -la "$HOME/.config/systemd/user" "$HOME/Library/LaunchAgents" 2>/dev/null || true
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user status invincible.service autobot.service 2>/dev/null | tail -30 || true
