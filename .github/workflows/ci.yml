# Every push and pull request: format, lints, tests (including the spec conformance vectors) and
# cargo-deny, on Linux and macOS (the two node platforms).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The one-line installer, as a fresh VPS or desktop runs it: builds this commit, installs
  # llama.cpp (the pinned upstream build on Linux, Homebrew on macOS), then checks the commands.
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - run: sh install.sh
        env:
          INVINCIBLE_YES: "1"
          INVINCIBLE_NO_SETUP: "1"
          # This commit, not the latest release.
          INVINCIBLE_FROM_SOURCE: "1"
          INVINCIBLE_REF: ${{ github.sha }}
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          invincible --version
          autobot --version
          autobot doctor || true
          test -x "$HOME/.invincible/llama.cpp/llama-server" || command -v llama-server
