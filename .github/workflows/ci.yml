# CI for Invincible. Its main copy is on sovware.io (Forgejo, sign-in only, no sign-ups), whose Actions run this file
# on the owner's runners for every push and pull request there, and its main takes only pull requests whose checks all
# passed (AGENTS.md). Should a public mirror ever run it too, the steps that need sovware.io's runners or secrets say
# so (`github.server_url`), and no job asks for a runner of the owner's by name: a pull request from a fork runs its
# own copy of a workflow, and a stranger's code must never reach the owner's machines.
#
#  typecheck   ┐
#  test        │ every push and PR
#  vocabulary  │ no word of the old theme in any tracked file (bench/vocabulary.ts, docs/ARCHITECTURE.md §10)
#  bench       │ the scorecard's quality gates (bun run bench --ci)
#  vectors     │ the parity vectors the Apple and Android apps test against are what this repository's code makes now
#  android     │ the Android app's JVM tests (held to the same vectors)
#  apple       │ the iPhone's tests and the Mac build, on the owner's Mac runner (label macos-xcode; sovware.io alone)
#  secrets     │ gitleaks over what the push (or the pull request) adds
#  sweep       ┘ the owner's private details, by the forge's secret list, in what it adds (sovware.io alone)
#  sandbox     real-Docker sandbox tests; opt-in via the repo variable SANDBOX_TESTS=true (a runner with Docker and
#              no KVM skips the microVM cases)
#
# The website's job comes back with apps/site.
#
# Hardening: read-only token, actions pinned to commit SHAs, no pull_request_target,
# credentials not persisted in the checkout, superseded runs cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
        if: github.server_url == 'https://github.com'
        env:
          INVINCIBLE_KEYSTORE: file
      # sovware.io's runner runs a job's steps as root in its container, and Invincible never runs as root: its installer
      # refuses to, and its terminals' tests act as a person's shell does. There the tests run as a user of their own.
      - name: bun test (as a user of its own, not root)
        if: github.server_url != 'https://github.com'
        run: |
          install -m 755 "$(command -v bun)" /usr/local/bin/bun
          id ci >/dev/null 2>&1 || useradd --create-home --uid 1001 ci
          chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && INVINCIBLE_KEYSTORE=file bun test"

  # The vocabulary check: no word of the old theme in any tracked file but docs/ARCHITECTURE.md §10, the licence, the
  # notice and the importer (bench/vocabulary.ts). It needs no install: it reads the checkout with git.
  vocabulary:
    name: Vocabulary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun run vocabulary

  # The scorecard: every suite's deterministic quality metrics against the recorded baselines (bench/baseline/).
  # A metric that got worse, one the baseline had that's gone, a suite that broke or has no baseline: red.
  # Timings are printed and never fail here: a runner isn't the machine the baseline was taken on.
  bench:
    name: Scorecard (quality gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run bench --ci
        if: github.server_url == 'https://github.com'
        env:
          INVINCIBLE_KEYSTORE: file
      # Its web suite measures the app in Chrome. GitHub's runners have one; sovware.io's runner image doesn't, so it
      # fetches one there, and runs the scorecard as a user of its own (Chrome, as Invincible, won't run as root), with
      # Chrome's sandbox off, which a container can't make: it loads nothing but this checkout's own app.
      - name: Chrome (sovware.io's runner has none)
        id: chrome
        if: github.server_url != 'https://github.com'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
          no-sudo: true
      - name: bun run bench --ci (as a user of its own, not root)
        if: github.server_url != 'https://github.com'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          install -m 755 "$(command -v bun)" /usr/local/bin/bun
          id ci >/dev/null 2>&1 || useradd --create-home --uid 1001 ci
          chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && INVINCIBLE_KEYSTORE=file INVINCIBLE_CHROME_NO_SANDBOX=1 CHROME='$CHROME_PATH' bun run bench --ci"

  # The parity vectors: apps/apple/InvincibleTests/Fixtures/core-vectors.json is what this repository's packages/core and
  # apps/web/src/lib make now, so the Apple and Android apps' tests hold them to it.
  vectors:
    name: Parity vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun apps/apple/scripts/vectors.ts --check

  # The Android app's JVM tests, held to the same vectors.
  android:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's runners come with the Android SDK; sovware.io's do not. There Google's command-line tools are fetched
      # and checked, the licenses accepted, and Gradle downloads the platform and build tools the app names. Version 19.0,
      # because from 23.0 `sdkmanager --licenses` writes no licenses and Gradle then refuses to download. Google publishes
      # only SHA-1 sums; this SHA-256 is of the file that matched its SHA-1.
      - name: Android SDK, where the runner has none
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_HOME:-}" ]; then exit 0; fi
          zip=commandlinetools-linux-13114758_latest.zip
          sdk="$RUNNER_TEMP/android-sdk"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://dl.google.com/android/repository/$zip"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/$zip" | sha256sum -c -
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$RUNNER_TEMP/$zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          # yes ends on SIGPIPE when sdkmanager is done, which pipefail would take for a failure.
          { yes || true; } | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      # Also checks the Gradle wrapper against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: apps/android

  # The iPhone's tests and the Mac build: on sovware.io alone, on the owner's Mac runner for this repository (label
  # macos-xcode, on its host: Xcode 27 and xcodegen), on a simulator made for the run and deleted after, the Mac app built
  # and never launched (it would load that Mac's own device key), and unregistered from Launch Services after. Only the
  # owner and their agents push to sovware.io, and GitHub's macOS runners have no macOS 27 SDK, so it is skipped there.
  apple:
    name: iPhone tests and Mac build
    if: github.server_url != 'https://github.com'
    runs-on: macos-xcode
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      # The host runner has no Node, so no actions/checkout.
      - name: Check out
        run: |
          git init -q .
          git -c "http.extraHeader=Authorization: token ${{ github.token }}" fetch -q --depth 1 \
            "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.ref }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
      # Swift packages (Sparkle) are fetched anonymously (-packageAuthorizationProvider netrc, and no .netrc): by default
      # Xcode looks for a github.com password in the login keychain, and a Mac that holds one asks whether xcodebuild may
      # use it, a prompt no one answers.
      - name: iPhone tests, on a simulator of their own
        working-directory: apps/apple
        run: |
          set -euo pipefail
          xcodegen generate --quiet
          # An XcodeGen that can't find its setting presets makes a project with no SDK, whose iPhone app is a Mac one.
          grep -q 'SDKROOT = iphoneos' Invincible.xcodeproj/project.pbxproj || { echo "::error::XcodeGen made the project without its setting presets (share/xcodegen beside its bin)"; exit 1; }
          # A cancelled job is killed, so its trap never deletes its simulator: delete any an earlier job left (this runner
          # runs one job at a time).
          xcrun simctl list devices -j | python3 -c 'import json,sys; [print(d["udid"]) for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("Invincible CI ")]' |
            while read -r left; do xcrun simctl shutdown "$left" 2>/dev/null || true; xcrun simctl delete "$left"; done
          # The newest iOS runtime the Mac has.
          runtime=$(xcrun simctl list runtimes iOS -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable")]; print(max(r, key=lambda x: [int(n) for n in x["version"].split(".")])["identifier"])')
          udid=$(xcrun simctl create "Invincible CI ${GITHUB_RUN_NUMBER:-0}" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")
          trap 'xcrun simctl delete "$udid"' EXIT
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcodebuild -project Invincible.xcodeproj -scheme Invincible -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build -packageAuthorizationProvider netrc test -skip-testing:InvincibleTests/MacShotsTests -quiet
      - name: Mac build (never launched)
        working-directory: apps/apple
        run: |
          xcodebuild -project Invincible.xcodeproj -scheme InvincibleMac -destination 'platform=macOS' -derivedDataPath build \
            -packageAuthorizationProvider netrc build -quiet
      # The Mac must not keep these builds as apps it could open: each one built (the Mac app, the Sparkle updater inside
      # it, and the iPhone app built for the simulator), whatever became of the steps before.
      - name: Forget the builds
        if: always()
        working-directory: apps/apple
        run: |
          find "$PWD/build/Build/Products" -name '*.app' -type d \
            -exec /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -u {} \; 2>/dev/null || true

  # Secrets: gitleaks 8.30.1 (its checked release) over the commits this push or pull request adds. (The tests carry
  # fakes made for them: each is said to be one, in .gitleaksignore or in the test.)
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks over what this adds
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tar=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$tar" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$tar"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$tar" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tar" -C "$RUNNER_TEMP" gitleaks
          from="${BASE:-$BEFORE}"
          # A new branch (no commit before it) is scanned from where it left main.
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1); fi
          echo "scanning $from..HEAD ($(git rev-list --count "$from..HEAD") commits)"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$from..HEAD" --no-banner --redact

  # What a push or a pull request adds, swept for the owner's private details (logins, home paths, tailnet addresses,
  # device names, account ids) before it can reach main. Its list is sovware.io's secret PRIVATE_SWEEP (an extended
  # regular expression), so it never enters the repository; a match is told by file and line alone, never by what
  # matched. On sovware.io alone: a mirror would only ever receive what passed it.
  sweep:
    name: Private sweep
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: What this adds, swept for private details
        env:
          PRIVATE: ${{ secrets.PRIVATE_SWEEP }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [ -n "$PRIVATE" ] || { echo "::error::sovware.io holds no PRIVATE_SWEEP secret: nothing can be swept, so nothing passes"; exit 1; }
          from="${BASE:-$BEFORE}"
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1); fi
          echo "sweeping what $from..HEAD adds ($(git rev-list --count "$from..HEAD") commits)"
          # Every added line as "file:line<TAB>text"; the text is matched, and only "file:line" is ever printed.
          git diff --unified=0 --no-color "$from" HEAD | awk '
            /^\+\+\+ / { file = substr($0, 7); next }
            /^@@ / { split($3, a, ","); line = substr(a[1], 2) + 0; next }
            /^\+/ { printf "%s:%d\t%s\n", file, line, substr($0, 2); line++ }' > "$RUNNER_TEMP/added.txt"
          hits=$(cut -f2- "$RUNNER_TEMP/added.txt" | grep -n -E -e "$PRIVATE" | cut -d: -f1 || true)
          if [ -n "$hits" ]; then
            for n in $hits; do echo "::error::a private detail is added at $(sed -n "${n}p" "$RUNNER_TEMP/added.txt" | cut -f1)"; done
            exit 1
          fi
          echo "nothing private added ($(wc -l < "$RUNNER_TEMP/added.txt") lines looked at)"

  sandbox:
    name: Sandbox (real Docker)
    needs: [typecheck, test]
    if: vars.SANDBOX_TESTS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: docker build -q -t invincible/sandbox:1 sandbox/
      - run: bun test packages/sandbox
        env:
          INVINCIBLE_DOCKER_TESTS: "1"
